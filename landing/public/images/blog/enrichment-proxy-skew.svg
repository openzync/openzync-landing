<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Skewed proxy data collapses to always-enrich">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .t { fill: #EDF1F7; } .m { fill: #A8B5C5; }
    .card { fill: #12151C; stroke: #232838; stroke-width: 2; }
    .signal { fill: #78A9F2; } .dim { fill: #5B6478; }
    .chip { fill: none; stroke: #232838; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #EDF1F7; } .m { fill: #A8B5C5; }
      .card { fill: #12151C; stroke: #232838; }
      .chip { stroke: #232838; }
    }
  </style>
  <text x="60" y="50" font-size="24" class="t">LongMemEval as proxy: positive-heavy</text>
  <text x="60" y="78" font-size="15" class="m">nearly every episode looks worth enriching</text>
  <rect x="60" y="110" width="560" height="220" rx="12" class="card"/>
  <text x="90" y="150" font-size="15" class="m">episodes worth enriching</text>
  <rect x="90" y="165" width="440" height="46" rx="8" fill="#78A9F2"/>
  <text x="540" y="195" font-size="15" class="t">~positives</text>
  <text x="90" y="235" font-size="15" class="m">episodes safe to skip</text>
  <rect x="90" y="250" width="46" height="46" rx="8" fill="#5B6478"/>
  <text x="150" y="280" font-size="15" class="t">~negatives</text>
  <line x1="700" y1="40" x2="700" y2="380" stroke="#5B6478" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="760" y="50" font-size="24" class="t">Learned policy: always enrich</text>
  <text x="760" y="78" font-size="15" class="m">the boundary slides off the data</text>
  <rect x="760" y="110" width="380" height="220" rx="12" class="card"/>
  <line x1="790" y1="300" x2="1110" y2="300" stroke="#5B6478" stroke-width="2"/>
  <text x="790" y="325" font-size="14" class="m">score 0</text>
  <text x="1060" y="325" font-size="14" class="m">score 1</text>
  <line x1="1070" y1="140" x2="1070" y2="300" stroke="#5B6478" stroke-width="4"/>
  <polygon points="1058,140 1082,140 1070,122" fill="#5B6478"/>
  <text x="1070" y="110" text-anchor="middle" font-size="15" class="dim">boundary ≈ 0</text>
  <text x="950" y="200" text-anchor="middle" font-size="18" class="t">every episode</text>
  <text x="950" y="228" text-anchor="middle" font-size="18" class="t">clears the bar</text>
  <text x="950" y="258" text-anchor="middle" font-size="15" class="m">gate saves nothing</text>
</svg>
