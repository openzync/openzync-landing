<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Two retrieval pipelines compared: on the left, structured memory — conversation history is built into summaries, embeddings, and a graph before any question is asked, then retrieved to answer, with a red construction-cost tag on the build step; on the right, raw logs plus agent search — a conversation archive is indexed at turn granularity and an agent-controlled search loop iterates against the index before answering; the comparison line shows raw logs plus agent search at 58.2 versus HippoRAG 2 graph at 53.2">
  <defs>
    <marker id="logsArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">logs vs. graph search: the view-catch</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">raw logs + agent-controlled search beat structured memory on retrieval</text>

  <!-- vertical divider -->
  <line x1="480" y1="96" x2="480" y2="426" stroke="#303A4E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ============ LEFT: structured memory ============ -->
  <rect x="24" y="96" width="432" height="330" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="40" y="120" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">structured memory</text>
  <text x="40" y="138" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">history → summaries, embeddings, trees, graphs → answer</text>

  <!-- node 1 -->
  <rect x="64" y="150" width="352" height="52" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="240" y="182" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">conversation history</text>

  <line x1="240" y1="202" x2="240" y2="220" stroke="#7A9BC4" stroke-width="2" marker-end="url(#logsArr)"/>

  <!-- node 2: the expensive step -->
  <rect x="64" y="220" width="352" height="64" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="240" y="246" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">build structure</text>
  <text x="240" y="262" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">summaries · embeddings · graph</text>
  <rect x="330" y="238" width="86" height="24" rx="6" fill="#171214" stroke="#E5534B" stroke-width="1.5"/>
  <text x="373" y="254" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">construction cost</text>

  <line x1="240" y1="284" x2="240" y2="302" stroke="#7A9BC4" stroke-width="2" marker-end="url(#logsArr)"/>

  <!-- node 3 -->
  <rect x="64" y="302" width="352" height="52" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="240" y="334" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">retrieve + answer</text>

  <text x="240" y="388" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">index built before any question is asked</text>

  <!-- ============ RIGHT: raw logs + agent search ============ -->
  <rect x="504" y="96" width="432" height="330" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <text x="520" y="120" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">raw logs + agent search</text>
  <text x="520" y="138" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">archive → lexical index → search loop → answer</text>

  <!-- node 1 -->
  <rect x="544" y="150" width="352" height="44" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="720" y="178" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">conversation archive</text>

  <line x1="720" y1="194" x2="720" y2="206" stroke="#7A9BC4" stroke-width="2" marker-end="url(#logsArr)"/>

  <!-- node 2 -->
  <rect x="544" y="206" width="352" height="44" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="720" y="228" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">lexical index</text>
  <text x="720" y="242" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">at turn granularity</text>

  <!-- the search loop: double-headed arrow -->
  <line x1="720" y1="250" x2="720" y2="270" stroke="#8FAFD9" stroke-width="2" marker-start="url(#logsArr)" marker-end="url(#logsArr)"/>

  <!-- node 3: the hero -->
  <rect x="544" y="270" width="352" height="44" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2.5"/>
  <text x="720" y="292" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">agent-controlled search loop</text>
  <text x="720" y="306" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">iterates against the index</text>

  <line x1="720" y1="314" x2="720" y2="326" stroke="#7A9BC4" stroke-width="2" marker-end="url(#logsArr)"/>

  <!-- node 4 -->
  <rect x="544" y="326" width="352" height="44" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="720" y="354" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">answer</text>

  <text x="720" y="388" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">no summaries, no embeddings — just the archive and a search loop</text>

  <!-- bottom comparison -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">raw logs + agent search: 58.2 · HippoRAG 2 (graph): 53.2 — independent LongMemEval run</text>
</svg>