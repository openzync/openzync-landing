  <!-- oracle ceiling dashed line at 91.8% (x0=340, 100% = 720) -->
  <line x1="1001" y1="84" x2="1001" y2="516" stroke="#A8B5C5" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="993" y="80" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="end">oracle ceiling 91.8 — GPT-4o reading full history offline</text>

