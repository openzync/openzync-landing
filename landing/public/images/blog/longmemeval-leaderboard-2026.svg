  <text x="954" y="484" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">84.23</text>

  <rect x="340" y="504" width="488" height="22" rx="4" fill="#2E3A4E"/>
  <text x="48"  y="520" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">Mem0 · old algorithm — same system, 26.6 points lower</text>
