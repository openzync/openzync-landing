<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="LongMemEval-S scores published in 2026, sorted from OMEGA at 95.4 down to Mem0's old algorithm at 67.8, with OpenZync at 87.1 highlighted, and the 91.8 oracle ceiling marked as a dashed line">
  <rect width="1200" height="560" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="48" y="46" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600">longmemeval-s, 2026 — the band</text>
