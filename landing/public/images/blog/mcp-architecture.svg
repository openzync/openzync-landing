<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="MCP architecture: a memory server sits between the MCP client and the LLM, exposing memory tools, and writing to a knowledge-graph storage layer below">
  <defs>
    <marker id="mcpArchArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">MCP architecture</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">a memory server slots between the client and the LLM — neither side has to change</text>

  <!-- LEFT: MCP client -->
  <rect x="40" y="100" width="230" height="190" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <text x="60" y="132" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">MCP client</text>
  <text x="60" y="152" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13">Claude Desktop · Cursor</text>

  <rect x="60" y="172" width="190" height="34" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="74" cy="189" r="6" fill="#4A7FC7"/>
  <text x="88" y="193" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">memory.* tools</text>

  <rect x="60" y="214" width="190" height="34" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="74" cy="231" r="6" fill="#8FAFD9"/>
  <text x="88" y="235" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">approval prompts</text>

  <text x="60" y="272" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">the client side stays unchanged</text>

  <!-- MIDDLE: MCP memory server -->
  <rect x="390" y="70" width="260" height="250" rx="14" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="410" y="102" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">MCP memory server</text>
  <text x="410" y="122" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13">stateless protocol · stateful store</text>
  <text x="410" y="146" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">exposed tools</text>

  <rect x="410" y="154" width="220" height="30" rx="8" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="428" cy="169" r="5" fill="#4A7FC7"/>
  <text x="440" y="173" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">memory.ingest — fold a turn in</text>

  <rect x="410" y="190" width="220" height="30" rx="8" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="428" cy="205" r="5" fill="#4A7FC7"/>
  <text x="440" y="209" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">memory.get_context — top-k recall</text>

  <rect x="410" y="226" width="220" height="30" rx="8" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="428" cy="241" r="5" fill="#4A7FC7"/>
  <text x="440" y="245" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">graph.search — entity traversal</text>

  <rect x="410" y="268" width="220" height="36" rx="9" fill="none" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="520" y="290" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">episodes · entities · facts</text>

  <!-- RIGHT: LLM -->
  <rect x="760" y="100" width="170" height="190" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <text x="845" y="132" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LLM</text>
  <text x="845" y="152" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">Claude · GPT · local</text>

  <rect x="780" y="172" width="130" height="34" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="794" cy="189" r="6" fill="#4A7FC7"/>
  <text x="808" y="193" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">context window</text>

  <rect x="780" y="214" width="130" height="34" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="794" cy="231" r="6" fill="#8FAFD9"/>
  <text x="808" y="235" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">prompt assembly</text>

  <text x="845" y="272" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">sees only what fits</text>

  <!-- storage layer -->
  <rect x="390" y="350" width="260" height="80" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="410" y="378" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Storage</text>
  <text x="410" y="398" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">knowledge graph · episodes</text>
  <text x="410" y="416" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">durable · versioned · queryable</text>

  <!-- arrows -->
  <line x1="274" y1="190" x2="386" y2="190" stroke="#7A9BC4" stroke-width="2" marker-start="url(#mcpArchArr)" marker-end="url(#mcpArchArr)"/>
  <text x="330" y="180" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">MCP protocol</text>
  <text x="330" y="212" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">stdio · SSE · HTTP</text>

  <line x1="654" y1="190" x2="756" y2="190" stroke="#7A9BC4" stroke-width="2" marker-start="url(#mcpArchArr)" marker-end="url(#mcpArchArr)"/>
  <text x="705" y="212" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">context injection</text>

  <line x1="520" y1="324" x2="520" y2="346" stroke="#7A9BC4" stroke-width="2" marker-start="url(#mcpArchArr)" marker-end="url(#mcpArchArr)"/>
  <text x="532" y="334" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">fold in · retrieve</text>

  <!-- bottom caption -->
  <text x="480" y="462" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-style="italic">The memory server sits between the client and the LLM — it stores what happened and feeds context back in.</text>
</svg>
