<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="How a mind virus spreads between AI agents without any exploit: an infected agent passes an idea along dashed red persuasion arrows even though context is wiped between hops, while a persistent MEMORY.md and SOUL.md strip underneath carries the payload — each infected agent writes it down and the next agent reads it at session start — so the idea survives every wipe and outlives every agent it infects; the third agent reads the same file and refuses">
  <defs>
    <marker id="virusArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E5534B"/>
    </marker>
    <marker id="cleanArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A7FC7"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">how a mind virus spreads</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">no exploit required — one agent persuades the next, and the memory file carries it forward</text>

  <!-- ============ agent chain ============ -->
  <rect x="70" y="112" width="180" height="84" rx="10" fill="#0A2A5A" stroke="#E5534B" stroke-width="2"/>
  <text x="160" y="142" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">agent 01</text>
  <text x="160" y="166" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">infected</text>

  <rect x="390" y="112" width="180" height="84" rx="10" fill="#0A2A5A" stroke="#E5534B" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="142" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">agent 02</text>
  <text x="480" y="166" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">partially infected</text>

  <rect x="710" y="112" width="180" height="84" rx="10" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="800" y="142" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">agent 03</text>
  <text x="800" y="166" fill="#4A7FC7" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">refused the idea</text>

  <!-- persuasion arrows -->
  <line x1="260" y1="140" x2="380" y2="140" stroke="#E5534B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#virusArr)"/>
  <line x1="580" y1="140" x2="700" y2="140" stroke="#E5534B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#virusArr)"/>
  <text x="320" y="124" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">persuasion</text>
  <text x="640" y="124" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">persuasion</text>

  <!-- context wipe marks -->
  <rect x="304" y="162" width="32" height="20" fill="#0D1117"/>
  <line x1="313" y1="165" x2="327" y2="179" stroke="#E5534B" stroke-width="2"/>
  <line x1="327" y1="165" x2="313" y2="179" stroke="#E5534B" stroke-width="2"/>
  <text x="320" y="198" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">context wiped</text>

  <rect x="624" y="162" width="32" height="20" fill="#0D1117"/>
  <line x1="633" y1="165" x2="647" y2="179" stroke="#E5534B" stroke-width="2"/>
  <line x1="647" y1="165" x2="633" y2="179" stroke="#E5534B" stroke-width="2"/>
  <text x="640" y="198" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">context wiped</text>

  <!-- write-down / read-up through the persistent file -->
  <line x1="130" y1="206" x2="130" y2="298" stroke="#E5534B" stroke-width="2" marker-end="url(#virusArr)"/>
  <text x="142" y="248" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11">writes payload</text>

  <line x1="430" y1="298" x2="430" y2="206" stroke="#E5534B" stroke-width="2" marker-end="url(#virusArr)"/>
  <text x="418" y="248" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="end">read at session start</text>

  <line x1="530" y1="206" x2="530" y2="298" stroke="#E5534B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#virusArr)"/>

  <line x1="830" y1="298" x2="830" y2="206" stroke="#4A7FC7" stroke-width="2" marker-end="url(#cleanArr)"/>
  <text x="818" y="248" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="end">reads it — refuses</text>

  <!-- ============ persistent file strip ============ -->
  <rect x="70" y="300" width="820" height="68" rx="10" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="90" y="330" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">MEMORY.md / SOUL.md</text>
  <text x="90" y="352" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">the shared file — written once, read at every session start</text>
  <rect x="742" y="314" width="128" height="24" rx="6" fill="#171214" stroke="#E5534B" stroke-width="1.5"/>
  <text x="806" y="330" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">survives context wipes</text>

  <!-- takeaway -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" font-style="italic" text-anchor="middle">the idea outlives every agent it infects</text>
</svg>
