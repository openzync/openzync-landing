<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The OpenZync LongMemEval-S harness pipeline: 500 questions pass an opt-in ingest gate into live hybrid search, concurrent judging, atomic checkpoint manifests, and a fail-closed report, with the dataset cache and results folder on the repo side">
  <defs>
    <marker id="hpArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="48" y="48" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600">the openzync longmemeval-s harness</text>
  <text x="48" y="70" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">500 questions · one live API · every verdict checkpointed before the next question</text>

  <!-- pipeline row -->
  <!-- 1. dataset -->
  <rect x="60" y="190" width="150" height="130" rx="14" fill="#0A2A5A" stroke="#14488C" stroke-width="2"/>
  <text x="135" y="222" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">LongMemEval-S</text>
  <text x="135" y="242" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">500 questions</text>
  <text x="135" y="262" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">five abilities</text>
  <text x="135" y="286" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">~115k tokens</text>
  <text x="135" y="300" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">per question</text>

  <line x1="210" y1="255" x2="240" y2="255" stroke="#7A9BC4" stroke-width="2" marker-end="url(#hpArr)"/>

  <!-- 2. ingest gate (red) -->
  <rect x="246" y="190" width="150" height="130" rx="14" fill="#171214" stroke="#E5534B" stroke-width="2"/>
  <!-- padlock glyph -->
  <rect x="128" y="212" width="16" height="13" rx="2" fill="none" stroke="#E5534B" stroke-width="2"/>
  <path d="M 131 212 v -4 a 5 5 0 0 1 10 0 v 4" fill="none" stroke="#E5534B" stroke-width="2"/>
  <text x="321" y="245" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">ingest gate</text>
  <text x="321" y="265" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">opt-in only —</text>
  <text x="321" y="281" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">enforced by flag</text>
  <text x="321" y="303" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">no --ingest:</text>
  <text x="321" y="315" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">writes nothing</text>

  <line x1="396" y1="255" x2="426" y2="255" stroke="#7A9BC4" stroke-width="2" marker-end="url(#hpArr)"/>

  <!-- 3. search + context -->
  <rect x="432" y="190" width="150" height="130" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="507" y="222" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">search + context</text>
  <text x="507" y="244" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">live API call</text>
  <text x="507" y="264" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">hybrid · episodes + facts</text>
  <text x="507" y="280" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">limit 10 · ctx 20</text>
  <text x="507" y="300" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">reranker off</text>

  <line x1="582" y1="255" x2="612" y2="255" stroke="#7A9BC4" stroke-width="2" marker-end="url(#hpArr)"/>

  <!-- 4. judge xN -->
  <rect x="618" y="190" width="150" height="130" rx="14" fill="#161B22" stroke="#4A7FC7" stroke-width="2"/>
  <text x="693" y="222" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">judge ×N</text>
  <text x="693" y="244" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">TaskGroup + semaphore</text>
  <text x="693" y="264" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Nemotron Ultra · temp 0</text>
  <text x="693" y="280" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">max_tokens 512</text>
  <text x="693" y="300" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">--workers 8</text>

  <line x1="768" y1="255" x2="798" y2="255" stroke="#7A9BC4" stroke-width="2" marker-end="url(#hpArr)"/>

  <!-- 5. atomic checkpoint -->
  <rect x="804" y="190" width="150" height="130" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="879" y="222" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">atomic checkpoint</text>
  <text x="879" y="244" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">manifest + verdict</text>
  <text x="879" y="264" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">tmp write + os.replace</text>
  <text x="879" y="280" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">after every question</text>
  <text x="879" y="300" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">never torn reads</text>

  <line x1="954" y1="255" x2="984" y2="255" stroke="#7A9BC4" stroke-width="2" marker-end="url(#hpArr)"/>

  <!-- 6. report -->
  <rect x="990" y="190" width="150" height="130" rx="14" fill="#161B22" stroke="#14488C" stroke-width="2"/>
  <text x="1065" y="222" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">report</text>
  <text x="1065" y="244" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">fail-closed metrics</text>
  <text x="1065" y="264" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">judge_errors tracked</text>
  <text x="1065" y="280" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">separately from score</text>
  <text x="1065" y="300" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">graded accuracy too</text>

  <!-- repo-side boxes -->
  <line x1="135" y1="440" x2="135" y2="326" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="60" y="440" width="420" height="96" rx="12" fill="#1A2332" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="84" y="470" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">repo-side · dataset cache</text>
  <text x="84" y="492" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">longmemeval_s_cleaned.json — sha-pinned, downloaded once, never re-fetched</text>
  <text x="84" y="512" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">the haystack is assumed pre-enriched unless --ingest is passed</text>

  <line x1="879" y1="440" x2="879" y2="326" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="720" y="440" width="420" height="96" rx="12" fill="#1A2332" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="744" y="470" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">repo-side · results/</text>
  <text x="744" y="492" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">per-question JSON + manifest.json with the run's config fingerprint</text>
  <text x="744" y="512" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">a resume with a mismatched fingerprint refuses to stitch</text>

  <!-- lane labels -->
  <text x="60" y="170" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">the run</text>
  <text x="60" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">on disk</text>

  <!-- bottom caption -->
  <text x="600" y="588" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">the gate is the point: a benchmark harness that can silently write to your memory store is measuring its own ingestion.</text>
</svg>
