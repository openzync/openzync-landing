<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Trusted memory architecture: three trust tiers of ingest, a verification gate with a reject-and-quarantine branch, a temporal versioned store, and scoped least-privilege retrieval">
  <defs>
    <marker id="memDefArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
    <marker id="memDefRej" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E5534B"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">trusted memory architecture</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">three trust tiers in — one gate, a temporal store, and scoped reads out</text>

  <!-- INGEST column -->
  <text x="60" y="100" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">1 · Ingest sources</text>

  <rect x="40" y="110" width="220" height="64" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="60" y="136" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">User-authored</text>
  <text x="60" y="157" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">trusted · direct input</text>

  <rect x="40" y="190" width="220" height="64" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="60" y="216" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Agent-extracted</text>
  <text x="60" y="237" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">asserted by the model</text>

  <!-- risk tier -->
  <rect x="40" y="270" width="220" height="64" rx="12" fill="#171214" stroke="#C95551" stroke-width="2"/>
  <text x="60" y="296" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Retrieved web · untrusted</text>
  <text x="60" y="317" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">docs · emails · web pages</text>
  <polygon points="242,282 232,300 252,300" fill="#E5534B"/>
  <text x="242" y="297" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">!</text>

  <!-- ingest arrows -->
  <line x1="260" y1="142" x2="312" y2="175" stroke="#7A9BC4" stroke-width="2" marker-end="url(#memDefArr)"/>
  <line x1="260" y1="222" x2="312" y2="215" stroke="#7A9BC4" stroke-width="2" marker-end="url(#memDefArr)"/>
  <line x1="260" y1="302" x2="312" y2="258" stroke="#E5534B" stroke-width="2" marker-end="url(#memDefRej)"/>

  <!-- VERIFICATION GATE -->
  <rect x="320" y="150" width="190" height="115" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="340" y="176" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">2 · Verification gate</text>
  <text x="340" y="200" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">provenance · allowlist</text>
  <text x="340" y="216" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">human-in-the-loop for</text>
  <text x="340" y="232" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">sensitive writes</text>

  <!-- reject branch -->
  <line x1="415" y1="265" x2="415" y2="348" stroke="#E5534B" stroke-width="2" marker-end="url(#memDefRej)"/>
  <text x="430" y="312" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10">reject · quarantine</text>

  <rect x="320" y="352" width="190" height="58" rx="10" fill="#171214" stroke="#C95551" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="340" y="376" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">quarantine</text>
  <text x="340" y="396" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">flagged · never served</text>

  <!-- TEMPORAL MEMORY STORE -->
  <rect x="560" y="150" width="200" height="115" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="580" y="176" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">3 · Temporal store</text>
  <text x="580" y="200" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">facts with validity windows</text>
  <text x="580" y="216" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">versioned · auditable</text>

  <!-- clock glyph -->
  <circle cx="740" cy="170" r="9" fill="none" stroke="#8FAFD9" stroke-width="1.5"/>
  <line x1="740" y1="170" x2="740" y2="165" stroke="#8FAFD9" stroke-width="1.5"/>
  <line x1="740" y1="170" x2="744" y2="173" stroke="#8FAFD9" stroke-width="1.5"/>

  <!-- SCOPED RETRIEVAL -->
  <rect x="790" y="150" width="150" height="115" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="810" y="176" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">4 · Retrieval</text>
  <text x="810" y="200" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">scoped reads</text>
  <text x="810" y="216" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">least-privilege</text>

  <!-- flow arrows -->
  <line x1="510" y1="207" x2="552" y2="207" stroke="#7A9BC4" stroke-width="2" marker-end="url(#memDefArr)"/>
  <line x1="760" y1="207" x2="782" y2="207" stroke="#7A9BC4" stroke-width="2" marker-end="url(#memDefArr)"/>
  <line x1="940" y1="207" x2="954" y2="207" stroke="#7A9BC4" stroke-width="2" marker-end="url(#memDefArr)"/>

  <!-- bottom caption -->
  <text x="480" y="445" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">provenance in, versioned store, least-privilege out</text>
</svg>
