<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Landmarks versus sliding window: sliding window with 12-chunk cache evicts the start view and runs out of memory, while a pose-indexed landmark bank with K equals 30 using 6 retrieved plus 5 recent plus 1 sink for 12 chunks survives a 64 second out-and-back of 384 latent frames and still regenerates the start view at 11.95 degrees rotation error with 4-step LoRA at 704 by 1280 realtime">
  <defs>
    <marker id="lmkEvictArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E5534B"/>
    </marker>
    <marker id="lmkRetArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A7FC7"/>
    </marker>
    <marker id="lmkTrajArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A7FC7"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- captions top-LEFT -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">landmarks vs sliding window</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">12-chunk fixed cache survives 64s out-and-back — sliding window loses it</text>

  <!-- left panel: sliding window -->
  <rect x="60" y="96" width="430" height="316" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="80" y="124" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">sliding-window attention</text>
  <text x="80" y="138" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">12-chunk cache · recency only</text>

  <!-- cache strip label -->
  <text x="80" y="162" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9">cache window →</text>

  <!-- chunk boxes: first 4 evicted (red) then 12 active (blue) simplified as 16 slots -->
  <!-- evicted -->
  <rect x="80" y="172" width="24" height="24" rx="5" fill="#171214" stroke="#E5534B" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="92" y="188" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">0</text>
  <rect x="108" y="172" width="24" height="24" rx="5" fill="#171214" stroke="#E5534B" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="120" y="188" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">1</text>
  <rect x="136" y="172" width="24" height="24" rx="5" fill="#171214" stroke="#E5534B" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="148" y="188" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">2</text>
  <rect x="164" y="172" width="24" height="24" rx="5" fill="#171214" stroke="#E5534B" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="176" y="188" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">3</text>
  <!-- ellipsis -->
  <text x="196" y="188" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9">...</text>
  <!-- active window: 12 chunks -->
  <rect x="210" y="172" width="24" height="24" rx="5" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="222" y="188" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">52</text>
  <rect x="238" y="172" width="24" height="24" rx="5" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="250" y="188" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">53</text>
  <rect x="266" y="172" width="24" height="24" rx="5" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="278" y="188" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">54</text>
  <rect x="294" y="172" width="24" height="24" rx="5" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="306" y="188" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">55</text>
  <rect x="322" y="172" width="24" height="24" rx="5" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="334" y="188" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">56</text>
  <rect x="350" y="172" width="24" height="24" rx="5" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="362" y="188" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">57</text>
  <rect x="378" y="172" width="24" height="24" rx="5" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="390" y="188" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">58</text>
  <rect x="406" y="172" width="24" height="24" rx="5" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="418" y="188" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">59</text>
  <rect x="434" y="172" width="24" height="24" rx="5" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="446" y="188" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">60</text>

  <!-- window bracket -->
  <line x1="210" y1="202" x2="458" y2="202" stroke="#4A7FC7" stroke-width="1.2"/>
  <line x1="210" y1="202" x2="210" y2="208" stroke="#4A7FC7" stroke-width="1.2"/>
  <line x1="458" y1="202" x2="458" y2="208" stroke="#4A7FC7" stroke-width="1.2"/>
  <text x="334" y="214" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">12-chunk window — no landmark logic</text>

  <!-- evicted start view box -->
  <rect x="80" y="232" width="200" height="48" rx="10" fill="#171214" stroke="#E5534B" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="98" y="250" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">start view · t = 0</text>
  <text x="98" y="264" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9">evicted by the slide</text>
  <circle cx="258" cy="252" r="10" fill="none" stroke="#E5534B" stroke-width="1.4"/>
  <line x1="253" y1="247" x2="263" y2="257" stroke="#E5534B" stroke-width="1.4"/>
  <line x1="263" y1="247" x2="253" y2="257" stroke="#E5534B" stroke-width="1.4"/>

  <!-- arrow: cache slides, evicts -->
  <line x1="188" y1="184" x2="204" y2="184" stroke="#E5534B" stroke-width="1.4" marker-end="url(#lmkEvictArr)"/>
  <text x="144" y="228" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">slides → evicts</text>

  <!-- OOM pill -->
  <rect x="300" y="234" width="170" height="22" rx="11" fill="#171214" stroke="#E5534B" stroke-width="1.4"/>
  <text x="385" y="249" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">OOM beyond 12</text>

  <!-- trajectory sketch -->
  <text x="80" y="304" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9">out-and-back · 64s / 384 latent</text>
  <line x1="80" y1="316" x2="230" y2="316" stroke="#303A4E" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="230" y1="316" x2="380" y2="316" stroke="#E5534B" stroke-width="1.4" marker-end="url(#lmkEvictArr)"/>
  <circle cx="80" cy="316" r="6" fill="#E5534B" stroke="#171214" stroke-width="1"/>
  <circle cx="380" cy="316" r="6" fill="none" stroke="#E5534B" stroke-width="1.6" stroke-dasharray="3 2"/>
  <text x="76" y="336" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">start</text>
  <text x="380" y="336" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">cannot return</text>
  <!-- failure outcome -->
  <rect x="80" y="348" width="390" height="26" rx="8" fill="#171214" stroke="#E5534B" stroke-width="1.2"/>
  <text x="275" y="364" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">loses start view · geometry collapses</text>

  <!-- right panel: landmark bank -->
  <rect x="510" y="96" width="390" height="316" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="530" y="124" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">pose-indexed landmark bank</text>
  <text x="530" y="138" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">K = 30 · retrieval decouples memory from recency</text>

  <!-- K=30 bank -->
  <rect x="530" y="154" width="350" height="48" rx="10" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.6"/>
  <text x="548" y="174" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">K = 30 landmark bank</text>
  <text x="548" y="188" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="9">pose-indexed · every landmark retrievable</text>
  <!-- bank dots -->
  <circle cx="820" cy="168" r="4" fill="#4A7FC7" opacity="0.9"/>
  <circle cx="830" cy="168" r="4" fill="#4A7FC7" opacity="0.7"/>
  <circle cx="840" cy="168" r="4" fill="#4A7FC7" opacity="0.5"/>
  <circle cx="850" cy="168" r="4" fill="#4A7FC7" opacity="0.35"/>
  <text x="860" y="172" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="8">30</text>

  <!-- composition row -->
  <rect x="530" y="216" width="94" height="30" rx="7" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="577" y="230" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">6 retrieved</text>
  <text x="577" y="242" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">pose match</text>

  <text x="631" y="236" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">+</text>

  <rect x="640" y="216" width="94" height="30" rx="7" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="687" y="230" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">5 recent</text>
  <text x="687" y="242" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">continuity</text>

  <text x="741" y="236" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">+</text>

  <rect x="750" y="216" width="70" height="30" rx="7" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="785" y="230" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">1 sink</text>
  <text x="785" y="242" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">anchor</text>

  <text x="830" y="236" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">=</text>
  <rect x="842" y="218" width="30" height="26" rx="7" fill="#0D1117" stroke="#4A7FC7" stroke-width="1.2"/>
  <text x="857" y="235" fill="#4A7FC7" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">12</text>

  <!-- fixed cache label -->
  <text x="705" y="262" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">fixed 12-chunk cache — same budget, smarter contents</text>
  <line x1="578" y1="252" x2="578" y2="268" stroke="#4A7FC7" stroke-width="1.1" marker-end="url(#lmkRetArr)"/>

  <!-- out-and-back trajectory with landmark retrieval -->
  <text x="530" y="288" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9">out-and-back · 64s / 384 latent</text>
  <!-- U-shaped path -->
  <path d="M 536 304 L 660 304 L 660 322 L 536 322" fill="none" stroke="#4A7FC7" stroke-width="1.6" marker-end="url(#lmkTrajArr)"/>
  <circle cx="536" cy="304" r="6" fill="#4A7FC7" stroke="#0A2A5A" stroke-width="1"/>
  <circle cx="536" cy="322" r="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.6"/>
  <text x="532" y="344" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">start</text>
  <text x="532" y="354" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">regenerated</text>
  <text x="660" y="298" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">far point</text>
  <!-- retrieval callout -->
  <rect x="670" y="306" width="140" height="22" rx="11" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.2"/>
  <text x="740" y="321" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">6 landmarks retrieved</text>

  <!-- success outcome + metrics -->
  <rect x="530" y="362" width="350" height="36" rx="10" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.6"/>
  <text x="548" y="378" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">start view holds</text>
  <text x="548" y="392" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9">11.95° RotErr · 4-step LoRA 704×1280 realtime</text>
  <circle cx="856" cy="380" r="8" fill="none" stroke="#4A7FC7" stroke-width="1.4"/>
  <path d="M 850 380 L 854 384 L 862 376" fill="none" stroke="#4A7FC7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bottom micro-note -->
  <text x="480" y="440" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle">fixed 12-chunk cache with retrieval beats any sliding window — same budget, the contents matter</text>
</svg>
