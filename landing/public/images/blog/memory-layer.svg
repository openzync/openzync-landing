<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Context window versus memory layer comparison">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <!-- page background -->
  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- LEFT: context window -->
  <rect x="24" y="70" width="440" height="330" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="48" y="104" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Context window</text>
  <text x="48" y="126" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13">working memory — whatever fits in the prompt</text>

  <rect x="48" y="150" width="392" height="44" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="74" cy="172" r="8" fill="#4A7FC7"/>
  <text x="92" y="168" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13">User — “Can we migrate Acme to the enterprise plan?”</text>
  <text x="92" y="185" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">support-week-12</text>

  <rect x="48" y="204" width="392" height="44" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="74" cy="226" r="8" fill="#8FAFD9"/>
  <text x="92" y="222" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13">Assistant — “Sure — I’ll open the migration ticket.”</text>
  <text x="92" y="239" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">support-week-12</text>

  <rect x="48" y="258" width="392" height="44" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="74" cy="280" r="8" fill="#4A7FC7"/>
  <text x="92" y="276" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13">User — “What plan is Acme on now?”</text>
  <text x="92" y="293" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">support-week-12</text>

  <rect x="48" y="312" width="392" height="44" rx="9" fill="none" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="244" y="339" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">…and everything else is forgotten</text>

  <path d="M 244 356 L 244 372" stroke="#7A9BC4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="244" y="390" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-style="italic">vanishes when the conversation ends</text>

  <!-- RIGHT: memory layer -->
  <rect x="496" y="70" width="440" height="330" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <text x="520" y="104" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Memory layer</text>
  <text x="520" y="126" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13">persistent, structured — queryable weeks later</text>

  <!-- edges — endpoints clipped to circle boundaries -->
  <line x1="613" y1="208" x2="727" y2="186" stroke="#4E5A6E" stroke-width="1.5"/>
  <line x1="613" y1="222" x2="727" y2="246" stroke="#4E5A6E" stroke-width="1.5"/>

  <!-- edge labels, offset clear of nodes and lines -->
  <text x="670" y="192" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">upgraded to</text>
  <text x="670" y="258" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">reported</text>

  <!-- Acme -->
  <circle cx="578" cy="215" r="36" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="578" y="212" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">Acme</text>
  <text x="578" y="228" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">customer</text>

  <!-- Enterprise -->
  <circle cx="756" cy="180" r="30" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="756" y="177" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Enterprise</text>
  <text x="756" y="192" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">plan · since Mar</text>

  <!-- Migration -->
  <circle cx="756" cy="252" r="30" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="756" y="249" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Migration</text>
  <text x="756" y="264" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">issue · open</text>

  <rect x="520" y="318" width="392" height="40" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <text x="716" y="342" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">entities · facts with valid-from · observations</text>

  <!-- bottom caption -->
  <text x="480" y="446" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-style="italic">A context window holds what fits. A memory layer holds what matters — and lets the agent ask for it later.</text>
</svg>
