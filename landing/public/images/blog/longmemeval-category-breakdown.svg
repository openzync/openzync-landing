<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="LongMemEval-S results by category: temporal reasoning, single-session assistant, and knowledge update at 100 percent, single-session user at 92.9 percent, multi-session at 66.9 percent, and single-session preference at 50 percent, against an overall 87.1 percent dashed reference line">
  <rect width="1200" height="500" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="48" y="46" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600">longmemeval-s by category</text>
  <text x="48" y="68" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">graded accuracy · question counts in parentheses · judge errors reported separately</text>

  <!-- overall reference line at 87.1% -->
  <line x1="992" y1="86" x2="992" y2="432" stroke="#7A9BC4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="992" y="80" fill="#7A9BC4" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">overall 87.1%</text>

  <!-- bars: x0=330, 100% = 760px -->
  <!-- temporal-reasoning 100.0% (133) -->
  <text x="60" y="126" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="14">temporal-reasoning <tspan fill="#8A99AB">(n=133)</tspan></text>
  <rect x="330" y="106" width="760" height="34" rx="6" fill="#4A7FC7"/>
  <text x="1100" y="129" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">100.0%</text>

  <!-- single-session-assistant 100.0% (56) -->
  <text x="60" y="182" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="14">single-session-assistant <tspan fill="#8A99AB">(n=56)</tspan></text>
  <rect x="330" y="162" width="760" height="34" rx="6" fill="#4A7FC7"/>
  <text x="1100" y="185" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">100.0%</text>

  <!-- knowledge-update 100.0% (78) -->
  <text x="60" y="238" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="14">knowledge-update <tspan fill="#8A99AB">(n=78)</tspan></text>
  <rect x="330" y="218" width="760" height="34" rx="6" fill="#4A7FC7"/>
  <text x="1100" y="241" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">100.0%</text>

  <!-- single-session-user 92.9% (70) -->
  <text x="60" y="294" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="14">single-session-user <tspan fill="#8A99AB">(n=70)</tspan></text>
  <rect x="330" y="274" width="706" height="34" rx="6" fill="#4A7FC7"/>
  <text x="1046" y="297" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">92.9%</text>

  <!-- multi-session 66.9% (133) -->
  <text x="60" y="350" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="14">multi-session <tspan fill="#8A99AB">(n=133)</tspan></text>
  <rect x="330" y="330" width="508" height="34" rx="6" fill="#E5534B"/>
  <text x="848" y="353" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">66.9%</text>

  <!-- single-session-preference 50.0% (30) -->
  <text x="60" y="406" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="14">single-session-preference <tspan fill="#8A99AB">(n=30)</tspan></text>
  <rect x="330" y="386" width="380" height="34" rx="6" fill="#E5534B"/>
  <text x="720" y="409" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">50.0%</text>

  <!-- legend -->
  <rect x="330" y="452" width="14" height="14" rx="3" fill="#4A7FC7"/>
  <text x="352" y="464" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">≥90% — strength</text>
  <rect x="500" y="452" width="14" height="14" rx="3" fill="#E5534B"/>
  <text x="522" y="464" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">&lt;70% — where we lose</text>

  <!-- bottom caption -->
  <text x="600" y="488" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">R@10 84.0% vs R@1 81.6%: the right memory is in the top 10 — the ranking, not the recall, is the bottleneck.</text>
</svg>
