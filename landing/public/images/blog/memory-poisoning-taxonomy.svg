<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="The attack taxonomy: five ways an attacker can write into agent memory — one transient, four persistent, including sleeper memory and cross-agent poisoning">
  <defs>
    <marker id="memTaxArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">five ways an attacker writes to agent memory</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">one is transient — four are persistent, and two of them fire later or fleet-wide</text>

  <!-- root: the target -->
  <rect x="370" y="98" width="220" height="52" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="480" y="122" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">agent memory</text>
  <text x="480" y="139" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">the target</text>

  <!-- fan arrows: root to branches -->
  <line x1="480" y1="150" x2="190" y2="202" stroke="#7A9BC4" stroke-width="2" marker-end="url(#memTaxArr)"/>
  <line x1="480" y1="150" x2="480" y2="202" stroke="#7A9BC4" stroke-width="2" marker-end="url(#memTaxArr)"/>
  <line x1="480" y1="150" x2="770" y2="202" stroke="#7A9BC4" stroke-width="2" marker-end="url(#memTaxArr)"/>
  <line x1="480" y1="150" x2="260" y2="312" stroke="#7A9BC4" stroke-width="2" marker-end="url(#memTaxArr)"/>
  <line x1="480" y1="150" x2="700" y2="312" stroke="#7A9BC4" stroke-width="2" marker-end="url(#memTaxArr)"/>

  <!-- ROW 1 -->
  <!-- 1: transient, no marker -->
  <rect x="50" y="210" width="280" height="68" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="70" y="236" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">1 · Session-scoped injection</text>
  <text x="70" y="258" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">transient · resets each session</text>

  <!-- 2: persistent -->
  <rect x="340" y="210" width="280" height="68" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="360" y="236" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">2 · Memory poisoning</text>
  <text x="360" y="258" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">persistent · written into long-term store</text>
  <polygon points="602,222 592,240 612,240" fill="#E5534B"/>
  <text x="602" y="237" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">!</text>

  <!-- 3: sleeper -->
  <rect x="630" y="210" width="280" height="68" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="650" y="236" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">3 · Sleeper memory</text>
  <text x="650" y="258" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">trigger-conditioned · fires later</text>
  <polygon points="892,222 882,240 902,240" fill="#E5534B"/>
  <text x="892" y="237" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">!</text>

  <!-- ROW 2 -->
  <!-- 4: indirect -->
  <rect x="120" y="320" width="280" height="68" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="140" y="346" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">4 · Indirect via retrieved content</text>
  <text x="140" y="368" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">docs · emails · web pages</text>
  <polygon points="382,332 372,350 392,350" fill="#E5534B"/>
  <text x="382" y="347" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">!</text>

  <!-- 5: cross-agent -->
  <rect x="560" y="320" width="280" height="68" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="580" y="346" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">5 · Cross-agent &amp; cross-client</text>
  <text x="580" y="368" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">shared memory · poison once, fleet-wide</text>
  <polygon points="822,332 812,350 832,350" fill="#E5534B"/>
  <text x="822" y="347" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">!</text>

  <!-- bottom caption -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">poison once, exploit forever</text>
</svg>
