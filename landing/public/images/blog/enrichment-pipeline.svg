<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Enrichment pipeline from conversations to knowledge graph">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#0D1117" rx="16"/>

  <!-- Stage 1: conversations -->
  <rect x="24" y="120" width="180" height="120" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <path d="M 70 140 h 44 a 10 10 0 0 1 10 10 v 14 a 10 10 0 0 1 -10 10 H 70 a 10 10 0 0 1 -10 -10 v -14 a 10 10 0 0 1 10 -10 z" fill="#1A2332" stroke="#4A7FC7" stroke-width="1.5"/>
  <path d="M 78 162 h 28 M 78 170 h 18 M 78 178 h 24" stroke="#8FAFD9" stroke-width="2" stroke-linecap="round"/>
  <text x="114" y="212" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="600">Conversations</text>
  <text x="114" y="230" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">support tickets, chat logs</text>

  <line x1="208" y1="180" x2="262" y2="180" stroke="#7A9BC4" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Stage 2: pipeline steps -->
  <text x="272" y="78" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">one async pass · idempotent · crash-safe</text>

  <rect x="272" y="96" width="122" height="76" rx="12" fill="#0A2A5A" stroke="#14488C" stroke-width="1.5"/>
  <text x="333" y="126" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">01 Classify</text>
  <text x="333" y="146" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">dialog type</text>

  <rect x="406" y="96" width="122" height="76" rx="12" fill="#0A2A5A" stroke="#14488C" stroke-width="1.5"/>
  <text x="467" y="126" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">02 Entities</text>
  <text x="467" y="146" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">customers, products</text>

  <rect x="540" y="96" width="122" height="76" rx="12" fill="#0A2A5A" stroke="#14488C" stroke-width="1.5"/>
  <text x="601" y="126" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">03 Facts</text>
  <text x="601" y="146" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">“Acme → Enterprise”</text>

  <rect x="674" y="96" width="122" height="76" rx="12" fill="#0A2A5A" stroke="#14488C" stroke-width="1.5"/>
  <text x="735" y="126" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">04 Embed</text>
  <text x="735" y="146" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">vector + BM25 index</text>

  <text x="504" y="200" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">each step sets a bit in an 8-bit status mask — a crashed worker resumes where it left off</text>

  <line x1="276" y1="230" x2="790" y2="230" stroke="#303A4E" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Stage 3: knowledge graph -->
  <line x1="204" y1="290" x2="258" y2="290" stroke="#7A9BC4" stroke-width="2" marker-end="url(#arr2)"/>

  <rect x="262" y="246" width="434" height="90" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <circle cx="330" cy="291" r="24" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="330" y="296" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Acme</text>
  <circle cx="412" cy="272" r="18" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="412" y="277" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Plan</text>
  <circle cx="412" cy="310" r="18" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="412" y="315" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Ticket</text>
  <line x1="354" y1="283" x2="394" y2="274" stroke="#4E5A6E" stroke-width="1.5"/>
  <line x1="354" y1="299" x2="394" y2="308" stroke="#4E5A6E" stroke-width="1.5"/>
  <text x="468" y="284" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Knowledge graph</text>
  <text x="468" y="306" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">PostgreSQL · SurrealDB · FalkorDB</text>
  <text x="468" y="322" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">temporal facts stay valid — superseded, never overwritten</text>

  <!-- return loop -->
  <path d="M 262 356 C 130 372 84 372 80 300 C 78 260 84 252 114 244" fill="none" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr2)"/>
  <text x="150" y="372" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic">context for the next prompt</text>

  <text x="480" y="404" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">raw conversations in, a queryable graph out — without you writing a single extraction rule.</text>
</svg>
