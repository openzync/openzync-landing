<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Episode lifecycle: five stages — conversation message, ingest, store, retrieve, context injection — feeding a durable store below">
  <defs>
    <marker id="mcpFlowArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">episode lifecycle</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">one conversation, five stages — each turn becomes retrievable context</text>

  <!-- stage numbers -->
  <circle cx="110" cy="132" r="13" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="110" y="137" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">1</text>
  <circle cx="295" cy="132" r="13" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="295" y="137" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">2</text>
  <circle cx="480" cy="132" r="13" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="480" y="137" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">3</text>
  <circle cx="664" cy="132" r="13" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="664" y="137" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">4</text>
  <circle cx="849" cy="132" r="13" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="849" y="137" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">5</text>

  <!-- node 1: Conversation -->
  <rect x="32" y="170" width="155" height="100" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="110" y="202" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="600">Conversation</text>
  <text x="110" y="226" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">the user says</text>
  <text x="110" y="242" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">something new</text>

  <!-- node 2: Ingest -->
  <rect x="217" y="170" width="155" height="100" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="295" y="202" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="600">Ingest</text>
  <text x="295" y="226" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">fold the turn</text>
  <text x="295" y="242" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">into an episode</text>

  <!-- node 3: Store -->
  <rect x="402" y="170" width="155" height="100" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="480" y="202" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="600">Store</text>
  <text x="480" y="226" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">entities, facts,</text>
  <text x="480" y="242" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">graph edges</text>

  <!-- node 4: Retrieve -->
  <rect x="587" y="170" width="155" height="100" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="664" y="202" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="600">Retrieve</text>
  <text x="664" y="226" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">on the next prompt,</text>
  <text x="664" y="242" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">top-k plus neighbors</text>

  <!-- node 5: Context injection -->
  <rect x="772" y="170" width="155" height="100" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="849" y="202" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="600">Context</text>
  <text x="849" y="222" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="600">injection</text>
  <text x="849" y="246" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">structured snippet</text>

  <!-- arrows between nodes -->
  <line x1="187" y1="220" x2="213" y2="220" stroke="#7A9BC4" stroke-width="2" marker-end="url(#mcpFlowArr)"/>
  <text x="200" y="160" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">turn</text>

  <line x1="372" y1="220" x2="398" y2="220" stroke="#7A9BC4" stroke-width="2" marker-end="url(#mcpFlowArr)"/>
  <text x="385" y="160" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">episode</text>

  <line x1="557" y1="220" x2="583" y2="220" stroke="#7A9BC4" stroke-width="2" marker-end="url(#mcpFlowArr)"/>
  <text x="570" y="160" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">query</text>

  <line x1="742" y1="220" x2="768" y2="220" stroke="#7A9BC4" stroke-width="2" marker-end="url(#mcpFlowArr)"/>
  <text x="755" y="160" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">context</text>

  <!-- durable store band -->
  <rect x="32" y="300" width="895" height="56" rx="10" fill="#161B22" stroke="#4A7FC7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="322" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">durable store</text>
  <text x="480" y="340" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">episodes · knowledge graph · facts with validity windows — write once, query forever</text>

  <!-- store writes down, retrieve reads up -->
  <line x1="480" y1="272" x2="480" y2="296" stroke="#7A9BC4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mcpFlowArr)"/>
  <line x1="664" y1="296" x2="664" y2="274" stroke="#7A9BC4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mcpFlowArr)"/>

  <!-- bottom caption -->
  <text x="480" y="440" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-style="italic">Each turn is folded in once, then queried forever — memory grows without re-prompting.</text>
</svg>
