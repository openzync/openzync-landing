<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Security: what the memory server sees — everything pasted is stored, with hosted versus self-hosted implications and API-key guidance">
  <defs>
    <marker id="mcpSecArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">what the memory server sees</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">your prompts are the product — know where they land, who holds them, and who holds the keys</text>

  <!-- LEFT: client -->
  <rect x="40" y="110" width="240" height="160" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <text x="60" y="140" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Client</text>
  <text x="60" y="160" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13">Claude Desktop · Cursor</text>

  <rect x="60" y="178" width="200" height="34" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <circle cx="74" cy="195" r="6" fill="#4A7FC7"/>
  <text x="88" y="199" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">prompt pasted here</text>

  <text x="60" y="244" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">every keystroke can become memory</text>

  <!-- MIDDLE: memory server with lock -->
  <rect x="360" y="110" width="240" height="160" rx="14" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="380" y="140" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Memory server</text>
  <text x="380" y="160" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13">holds what it ingests</text>

  <!-- lock icon -->
  <rect x="556" y="162" width="26" height="22" rx="5" fill="none" stroke="#8FAFD9" stroke-width="2"/>
  <path d="M 562 162 v -6 a 7 7 0 0 1 14 0 v 6" fill="none" stroke="#8FAFD9" stroke-width="2"/>
  <circle cx="569" cy="172" r="2.5" fill="#8FAFD9"/>

  <circle cx="396" cy="196" r="5" fill="#4A7FC7"/>
  <text x="410" y="200" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">episodes — full transcripts</text>
  <circle cx="396" cy="224" r="5" fill="#4A7FC7"/>
  <text x="410" y="228" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">facts and entities</text>
  <circle cx="396" cy="252" r="5" fill="#8FAFD9"/>
  <text x="410" y="256" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">API keys in MCP headers</text>

  <!-- flow arrows -->
  <line x1="284" y1="190" x2="356" y2="190" stroke="#7A9BC4" stroke-width="2" marker-end="url(#mcpSecArr)"/>
  <text x="320" y="180" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">MCP — everything is sent</text>

  <line x1="160" y1="272" x2="160" y2="286" stroke="#7A9BC4" stroke-width="1.5" marker-end="url(#mcpSecArr)"/>

  <!-- callouts -->
  <rect x="40" y="290" width="240" height="50" rx="9" fill="#161B22" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="160" y="320" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">everything you paste is stored</text>

  <rect x="360" y="290" width="240" height="50" rx="9" fill="#161B22" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="310" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11">API keys ride in MCP headers — scope</text>
  <text x="380" y="326" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11">to read-only tools, rotate, never log</text>

  <!-- hosting paths -->
  <rect x="40" y="360" width="430" height="95" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="60" y="388" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Hosted — data leaves your machine</text>
  <circle cx="68" cy="408" r="2.5" fill="#4A7FC7"/>
  <text x="80" y="412" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">vendor reads? compliance review, data residency</text>
  <circle cx="68" cy="428" r="2.5" fill="#4A7FC7"/>
  <text x="80" y="432" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">keys at rest on their infrastructure</text>

  <rect x="490" y="360" width="430" height="95" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="510" y="388" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Self-hosted — you control the data</text>
  <circle cx="518" cy="408" r="2.5" fill="#4A7FC7"/>
  <text x="530" y="412" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">you own it, you secure it: backups, access, rotation</text>
  <circle cx="518" cy="428" r="2.5" fill="#4A7FC7"/>
  <text x="530" y="432" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">keys stay in your environment</text>

  <!-- bottom caption -->
  <text x="480" y="474" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">The memory server is a trust boundary — choose where it lives, what it keeps, and who holds the keys.</text>
</svg>
