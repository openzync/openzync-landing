<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="The three-layer stack: MCP for agent-to-tool access and A2A for agent-to-agent delegation both ship today — shared memory, the third layer, is the missing gap">
  <defs>
    <marker id="a2aLayersArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">the three-layer stack</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">MCP and A2A ship today — shared memory is the layer that does not exist yet</text>

  <!-- LAYER 3 (top): Memory — the gap -->
  <rect x="50" y="90" width="860" height="100" rx="12" fill="#161B22" stroke="#4A7FC7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="75" y="122" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Memory — shared state</text>
  <text x="75" y="144" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">cross-agent context · episodes · facts</text>

  <!-- gap icon: dashed store with a question mark -->
  <rect x="596" y="112" width="48" height="54" rx="8" fill="none" stroke="#8FAFD9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="152" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle">?</text>

  <rect x="740" y="104" width="150" height="26" rx="13" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="815" y="120" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">the gap · not shipped</text>

  <!-- LAYER 2 (middle): A2A -->
  <rect x="50" y="205" width="860" height="100" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="75" y="237" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">A2A — agent ↔ agent</text>
  <text x="75" y="259" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">task delegation · discovery · agent cards</text>

  <!-- two agents connected by an arrow -->
  <circle cx="598" cy="247" r="10" fill="none" stroke="#8FAFD9" stroke-width="2"/>
  <path d="M 578 266 a 20 20 0 0 1 40 0 z" fill="#8FAFD9"/>
  <circle cx="716" cy="247" r="10" fill="none" stroke="#8FAFD9" stroke-width="2"/>
  <path d="M 696 266 a 20 20 0 0 1 40 0 z" fill="#8FAFD9"/>
  <line x1="620" y1="260" x2="694" y2="260" stroke="#7A9BC4" stroke-width="2" marker-start="url(#a2aLayersArr)" marker-end="url(#a2aLayersArr)"/>

  <rect x="740" y="219" width="150" height="26" rx="13" fill="#161B22" stroke="#303A4E"/>
  <text x="815" y="235" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">standard · shipped</text>

  <!-- LAYER 1 (bottom): MCP -->
  <rect x="50" y="320" width="860" height="100" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="75" y="352" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">MCP — agent ↔ tools &amp; data</text>
  <text x="75" y="374" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">tools · resources · context window</text>

  <!-- tools icon: terminal + store icon: database -->
  <rect x="596" y="344" width="44" height="52" rx="8" fill="none" stroke="#8FAFD9" stroke-width="1.5"/>
  <text x="618" y="376" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">&gt;_</text>
  <rect x="660" y="344" width="44" height="52" rx="8" fill="none" stroke="#8FAFD9" stroke-width="1.5"/>
  <line x1="670" y1="360" x2="694" y2="360" stroke="#8FAFD9" stroke-width="1.5"/>
  <line x1="670" y1="370" x2="694" y2="370" stroke="#8FAFD9" stroke-width="1.5"/>
  <line x1="670" y1="380" x2="694" y2="380" stroke="#8FAFD9" stroke-width="1.5"/>

  <rect x="740" y="334" width="150" height="26" rx="13" fill="#161B22" stroke="#303A4E"/>
  <text x="815" y="350" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">standard · shipped</text>

  <!-- bottom caption -->
  <text x="480" y="462" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-style="italic">Two layers ship today — MCP and A2A. The third, shared memory, is the gap this stack leaves open.</text>
</svg>
