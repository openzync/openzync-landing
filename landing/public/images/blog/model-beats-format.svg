<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="A horizontal bar chart of effect sizes from a 9,649-experiment study: model choice (frontier versus open-source) shows a large positive effect of plus 21 points, file-based context shows plus 2.7 percent on frontier models and minus 7.7 percent on open-source models, and format choice shows no significant effect with p equals 0.484 — the model is the dominant lever, not the format or the file layout">
  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">what a 9,649-experiment study found</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">model choice dwarfs format choice</text>

  <!-- panel -->
  <rect x="60" y="96" width="840" height="310" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="80" y="124" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">effect size on task accuracy</text>
  <text x="80" y="142" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">points and percentage points · higher is better</text>

  <!-- zero line -->
  <line x1="474" y1="150" x2="474" y2="350" stroke="#303A4E" stroke-width="1.5"/>

  <!-- bar 1: model choice — the dominant lever -->
  <rect x="474" y="150" width="324" height="28" rx="6" fill="#4A7FC7"/>
  <text x="806" y="164" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">+21 pts</text>

  <!-- bar 2: file-based context, frontier -->
  <rect x="474" y="202" width="42" height="28" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="524" y="216" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">+2.7%</text>

  <!-- bar 3: file-based context, open-source — negative -->
  <rect x="355" y="254" width="119" height="28" rx="6" fill="#171214" stroke="#E5534B" stroke-width="1.5"/>
  <text x="347" y="268" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">−7.7%</text>

  <!-- bar 4: format choice — no effect -->
  <rect x="474" y="306" width="8" height="28" rx="4" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="490" y="320" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">no effect · p = 0.484</text>

  <!-- row labels -->
  <text x="300" y="158" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">Model choice</text>
  <text x="300" y="174" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">(frontier vs. open-source)</text>

  <text x="300" y="210" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">File-based context</text>
  <text x="300" y="226" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">(frontier)</text>

  <text x="300" y="262" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">File-based context</text>
  <text x="300" y="278" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">(open-source)</text>

  <text x="300" y="314" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">Format choice</text>
  <text x="300" y="330" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">(YAML / Markdown / JSON / TOON)</text>

  <!-- x-axis ticks -->
  <line x1="320" y1="350" x2="320" y2="356" stroke="#303A4E" stroke-width="1.5"/>
  <line x1="474" y1="350" x2="474" y2="356" stroke="#303A4E" stroke-width="1.5"/>
  <line x1="629" y1="350" x2="629" y2="356" stroke="#303A4E" stroke-width="1.5"/>
  <line x1="783" y1="350" x2="783" y2="356" stroke="#303A4E" stroke-width="1.5"/>
  <line x1="860" y1="350" x2="860" y2="356" stroke="#303A4E" stroke-width="1.5"/>

  <text x="320" y="372" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">−10</text>
  <text x="474" y="372" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">0</text>
  <text x="629" y="372" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">+10</text>
  <text x="783" y="372" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">+20</text>
  <text x="860" y="372" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">+25</text>

  <text x="590" y="392" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">effect size</text>

  <!-- takeaway -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">the largest lever is the model — not the format, not the file layout</text>
</svg>