<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Deleting one fact, three layers deep: in the raw transcript the phone number is struck through and marked deleted, yet in the vector-embedding layer derived vectors still glow red because deleting text does not delete what was embedded, and in the model-behavior layer an output bubble still repeats the number, absorbed in summaries and behavior — each surviving copy re-contaminates backups and caches on restore">
  <defs>
    <marker id="propArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">deleting one fact, three layers deep</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">why erasure propagates worse than anyone budgets for</text>

  <!-- ============ row 1: raw transcript ============ -->
  <rect x="60" y="110" width="730" height="76" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="80" y="134" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">raw transcript</text>

  <rect x="682" y="116" width="92" height="24" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <polyline points="698,128 703,134 712,123" fill="none" stroke="#4A7FC7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="722" y="133" fill="#7A9BC4" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">deleted</text>

  <text x="100" y="166" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">“call me tomorrow on </text>
  <text x="244" y="166" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" textLength="100">+1 415 555 0192</text>
  <line x1="240" y1="162" x2="348" y2="162" stroke="#E5534B" stroke-width="2"/>
  <text x="356" y="166" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">” — session 47, 14:02</text>

  <line x1="425" y1="188" x2="425" y2="212" stroke="#7A9BC4" stroke-width="2" marker-end="url(#propArr)"/>
  <text x="437" y="204" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">embedding extraction ran at ingest</text>

  <!-- ============ row 2: vector embeddings ============ -->
  <rect x="60" y="216" width="730" height="86" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="80" y="240" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">vector embeddings</text>

  <rect x="77" y="247" width="78" height="30" rx="8" fill="none" stroke="#E5534B" stroke-width="1" opacity="0.35"/>
  <rect x="80" y="250" width="72" height="24" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="116" y="266" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">vec-01</text>

  <rect x="159" y="250" width="72" height="24" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="195" y="266" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">vec-02</text>

  <rect x="241" y="247" width="78" height="30" rx="8" fill="none" stroke="#E5534B" stroke-width="1" opacity="0.35"/>
  <rect x="244" y="250" width="72" height="24" rx="6" fill="#171214" stroke="#E5534B" stroke-width="2"/>
  <text x="280" y="266" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">vec-03</text>

  <rect x="326" y="250" width="72" height="24" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="362" y="266" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">vec-04</text>

  <rect x="408" y="250" width="72" height="24" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="444" y="266" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">vec-05</text>

  <rect x="490" y="250" width="72" height="24" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="526" y="266" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">vec-06</text>

  <rect x="569" y="247" width="78" height="30" rx="8" fill="none" stroke="#E5534B" stroke-width="1" opacity="0.35"/>
  <rect x="572" y="250" width="72" height="24" rx="6" fill="#171214" stroke="#E5534B" stroke-width="2"/>
  <text x="608" y="266" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">vec-07</text>

  <rect x="654" y="250" width="72" height="24" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="690" y="266" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">vec-08</text>

  <text x="80" y="292" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">delete text ≠ delete what was embedded</text>
  <text x="572" y="292" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">derived vectors persist</text>

  <line x1="425" y1="304" x2="425" y2="328" stroke="#7A9BC4" stroke-width="2" marker-end="url(#propArr)"/>
  <text x="437" y="320" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">summaries + behavior absorb the rest</text>

  <!-- ============ row 3: model behavior ============ -->
  <rect x="60" y="332" width="730" height="82" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="80" y="356" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">model behavior</text>

  <rect x="80" y="366" width="120" height="34" rx="8" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="140" y="387" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">model</text>

  <line x1="204" y1="383" x2="232" y2="383" stroke="#7A9BC4" stroke-width="2" marker-end="url(#propArr)"/>

  <rect x="244" y="366" width="266" height="34" rx="8" fill="#171214" stroke="#E5534B" stroke-width="1.5"/>
  <text x="258" y="387" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11">“sure — +1 415 555 0192 works”</text>

  <text x="524" y="378" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">absorbed in summaries &amp; behavior</text>
  <text x="524" y="396" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10">summaries regenerated before deletion survive</text>

  <!-- ============ right annotation strip ============ -->
  <rect x="806" y="96" width="94" height="318" rx="10" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="841" y="255" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle" transform="rotate(-90 841 255)">each surviving copy re-contaminates</text>
  <text x="865" y="255" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle" transform="rotate(-90 865 255)">backups and caches on restore</text>

  <!-- takeaway -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" font-style="italic" text-anchor="middle">one delete request, three persistence layers, zero guarantees without provenance</text>
</svg>
