<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Two memory loops compared: on the left, a self-diagnosis echo chamber where an agent acts, reflects on a failure, stores the resulting belief in a red WRONG-marked box, and acts again on the stored belief while confidence bars climb higher across trials 1, 2, and 3 — the wrong belief compounds with repetition; on the right, the grounded loop where observable failure signals interrupt the self-report path before a grounded fact is stored and the wrong belief is retired, with a note to supersede rather than overwrite — the cycle breaks">
  <defs>
    <marker id="confabArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
    <marker id="confabEcho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E5534B"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">memory confabulation: the echo chamber</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">self-report loops compound wrong beliefs</text>

  <!-- vertical divider -->
  <line x1="480" y1="96" x2="480" y2="426" stroke="#303A4E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ============ LEFT: the failure loop ============ -->
  <rect x="24" y="96" width="432" height="330" rx="14" fill="#171214" stroke="#E5534B" stroke-width="1.5"/>
  <text x="40" y="120" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">self-diagnosis loop</text>
  <text x="40" y="138" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">reflexion on its own output</text>

  <!-- node 1 -->
  <rect x="24" y="140" width="190" height="52" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="119" y="172" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Agent acts</text>

  <!-- node 2 -->
  <rect x="266" y="140" width="190" height="52" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="361" y="168" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Reflects on failure</text>
  <text x="361" y="184" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">self-report</text>

  <!-- node 3: wrong belief -->
  <rect x="266" y="290" width="190" height="52" rx="9" fill="#171214" stroke="#E5534B" stroke-width="2"/>
  <text x="361" y="318" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Stores belief</text>

  <!-- node 4 -->
  <rect x="24" y="290" width="190" height="52" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="119" y="316" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Acts again</text>
  <text x="119" y="332" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">on stored belief</text>

  <!-- WRONG badge -->
  <rect x="396" y="272" width="60" height="24" rx="9" fill="#171214" stroke="#E5534B" stroke-width="1.5"/>
  <text x="426" y="288" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">WRONG</text>

  <!-- loop arrows: 1 -> 2 -> 3 -> 4 -> back to 2 -->
  <line x1="214" y1="166" x2="262" y2="166" stroke="#7A9BC4" stroke-width="2" marker-end="url(#confabArr)"/>
  <line x1="361" y1="196" x2="361" y2="286" stroke="#7A9BC4" stroke-width="2" marker-end="url(#confabArr)"/>
  <line x1="266" y1="316" x2="218" y2="316" stroke="#7A9BC4" stroke-width="2" marker-end="url(#confabArr)"/>
  <path d="M 160 292 Q 280 270 300 194" fill="none" stroke="#E5534B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#confabEcho)"/>
  <text x="310" y="216" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">loop repeats</text>

  <!-- climbing confidence: wrong belief gains confidence through repetition -->
  <text x="240" y="352" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">confidence in the wrong belief</text>
  <rect x="150" y="390" width="36" height="20" rx="4" fill="#E5534B"/>
  <rect x="222" y="374" width="36" height="36" rx="4" fill="#E5534B"/>
  <rect x="294" y="358" width="36" height="52" rx="4" fill="#E5534B"/>
  <text x="168" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">trial 1</text>
  <text x="240" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">trial 2</text>
  <text x="312" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">trial 3</text>

  <text x="240" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">Self-diagnosis: the belief compounds</text>

  <!-- ============ RIGHT: the grounded loop ============ -->
  <rect x="504" y="96" width="432" height="330" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <text x="520" y="120" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">grounded loop</text>
  <text x="520" y="138" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">programmatic signals break the loop</text>

  <!-- node 1 -->
  <rect x="528" y="140" width="190" height="52" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="623" y="172" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Agent acts</text>

  <!-- node 2: the observable-signals interrupt -->
  <rect x="746" y="140" width="190" height="52" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="841" y="168" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Observable failure signals</text>
  <text x="841" y="184" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">programmatic · not self-report</text>

  <!-- node 3: grounded store -->
  <rect x="746" y="290" width="190" height="52" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="841" y="318" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Stores grounded fact</text>
  <text x="841" y="334" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">validity window opens</text>

  <!-- node 4 -->
  <rect x="528" y="290" width="190" height="52" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="623" y="318" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Retires wrong belief</text>

  <!-- loop arrows: 1 -> 2 -> 3 -> 4 -> back to 1 -->
  <line x1="718" y1="166" x2="742" y2="166" stroke="#7A9BC4" stroke-width="2" marker-end="url(#confabArr)"/>
  <line x1="841" y1="196" x2="841" y2="286" stroke="#7A9BC4" stroke-width="2" marker-end="url(#confabArr)"/>
  <line x1="746" y1="316" x2="722" y2="316" stroke="#7A9BC4" stroke-width="2" marker-end="url(#confabArr)"/>
  <line x1="623" y1="292" x2="623" y2="196" stroke="#7A9BC4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#confabArr)"/>
  <text x="633" y="250" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">acts again</text>

  <!-- supersede note near the store -->
  <text x="746" y="364" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic">supersede, don&apos;t overwrite</text>

  <text x="720" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">Programmatic extraction: the cycle breaks</text>
</svg>
