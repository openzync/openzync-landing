<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Enrichment gate fork diagram">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .t { fill: #EDF1F7; } .m { fill: #A8B5C5; }
    .card { fill: #12151C; stroke: #232838; stroke-width: 2; }
    .signal { fill: #78A9F2; } .dim { fill: #5B6478; }
    .chip { fill: none; stroke: #232838; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #EDF1F7; } .m { fill: #A8B5C5; }
      .card { fill: #12151C; stroke: #232838; }
      .chip { stroke: #232838; }
    }
  </style>
  <rect x="30" y="160" width="200" height="100" rx="12" class="card"/>
  <text x="130" y="200" text-anchor="middle" font-size="22" class="t">ingest rail</text>
  <text x="130" y="228" text-anchor="middle" font-size="15" class="m">POST /memory → Episode</text>
  <line x1="230" y1="210" x2="300" y2="210" stroke="#5B6478" stroke-width="3"/>
  <polygon points="300,198 322,210 300,222" fill="#5B6478"/>
  <rect x="322" y="140" width="240" height="140" rx="12" class="card"/>
  <text x="442" y="182" text-anchor="middle" font-size="22" class="t">classifier</text>
  <text x="442" y="212" text-anchor="middle" font-size="15" class="m">OpenZync/enrichment-gating-v1</text>
  <text x="442" y="238" text-anchor="middle" font-size="20" fill="#F0B65C">threshold 0.50</text>
  <text x="442" y="260" text-anchor="middle" font-size="14" class="m">sigmoid(pos logit)</text>
  <line x1="562" y1="170" x2="660" y2="90" stroke="#5B6478" stroke-width="3"/>
  <polygon points="660,78 676,92 656,104" fill="#5B6478"/>
  <line x1="562" y1="250" x2="660" y2="330" stroke="#78A9F2" stroke-width="3"/>
  <polygon points="660,316 676,328 656,342" fill="#78A9F2"/>
  <rect x="676" y="20" width="494" height="140" rx="12" class="card"/>
  <text x="923" y="58" text-anchor="middle" font-size="20" class="dim">low score — skip LLM</text>
  <text x="923" y="88" text-anchor="middle" font-size="16" class="t">embeddings + stored</text>
  <text x="923" y="114" text-anchor="middle" font-size="14" class="m">apply_enrichment_bits marks LLM bits skipped</text>
  <rect x="676" y="260" width="494" height="140" rx="12" class="card" stroke="#78A9F2" stroke-width="2.5"/>
  <text x="923" y="298" text-anchor="middle" font-size="20" class="signal">high score — enrich</text>
  <text x="923" y="328" text-anchor="middle" font-size="16" class="t">facts + entities + graph + stored</text>
  <text x="923" y="354" text-anchor="middle" font-size="14" class="m">single LLM call via enrich_episode</text>
  <text x="690" y="200" font-size="16" class="m">score &lt; 0.5</text>
  <text x="690" y="240" font-size="16" class="m">score ≥ 0.5</text>
</svg>
