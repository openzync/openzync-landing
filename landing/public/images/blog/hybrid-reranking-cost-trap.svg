<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Hybrid equal-weight retrieval underperforms vector-alone on NDCG in the 40-candidate Oracle corpus demo, while reranking adds about 2.2 seconds p50 latency, so hybrid is not free">
  <defs>
    <marker id="hybridNegArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E5534B"/>
    </marker>
    <marker id="rerankCostArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E5534B"/>
    </marker>
    <marker id="hybridBarArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A7FC7"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- captions top-LEFT -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">hybrid is not free</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">reranking buys NDCG — at 2.2s p50 on a 23-doc corpus</text>

  <!-- main panel -->
  <rect x="60" y="96" width="840" height="316" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>

  <!-- left: NDCG section -->
  <text x="80" y="126" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">NDCG @ 40 candidates</text>
  <text x="80" y="142" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">higher is better · equal-weight hybrid = 0.5 vector + 0.5 BM25</text>

  <!-- vector-alone bar (higher NDCG) -->
  <text x="80" y="172" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="11">vector-alone</text>
  <rect x="80" y="182" width="248" height="22" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.6"/>
  <text x="336" y="198" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10">higher</text>

  <!-- hybrid bar (lower NDCG) -->
  <text x="80" y="222" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="11">equal-weight hybrid</text>
  <rect x="80" y="232" width="188" height="22" rx="6" fill="#171214" stroke="#E5534B" stroke-width="1.6"/>
  <line x1="276" y1="243" x2="308" y2="243" stroke="#E5534B" stroke-width="1.6" marker-end="url(#hybridNegArr)"/>
  <text x="316" y="248" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">lower</text>

  <!-- subtle NDCG scale -->
  <line x1="80" y1="268" x2="360" y2="268" stroke="#303A4E" stroke-width="1"/>
  <text x="80" y="282" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9">NDCG →</text>
  <text x="336" y="282" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="end">hybrid lost on this corpus</text>

  <!-- divider -->
  <line x1="460" y1="116" x2="460" y2="390" stroke="#303A4E" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- right: latency section -->
  <text x="480" y="126" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">p50 latency · same experiment</text>
  <text x="480" y="142" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">retrieval alone vs + cross-encoder rerank</text>

  <!-- retrieval alone (short) -->
  <text x="480" y="172" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="11">retrieval alone</text>
  <rect x="480" y="182" width="56" height="22" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.6"/>
  <text x="544" y="198" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10">~0.12s</text>

  <!-- reranked (long) — composite: base + added cost -->
  <text x="480" y="222" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="11">+ rerank (40 candidates)</text>
  <!-- base segment -->
  <rect x="480" y="232" width="56" height="22" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.6"/>
  <!-- added cost segment -->
  <rect x="536" y="232" width="198" height="22" rx="6" fill="#171214" stroke="#E5534B" stroke-width="1.6"/>
  <line x1="742" y1="243" x2="762" y2="243" stroke="#E5534B" stroke-width="1.6" marker-end="url(#rerankCostArr)"/>
  <text x="770" y="248" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">+2.2s p50</text>
  <text x="480" y="270" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9">total ~2.3s · 19× the retrieval budget</text>

  <!-- footnote inside panel -->
  <rect x="480" y="298" width="400" height="26" rx="8" fill="#0D1117" stroke="#303A4E" stroke-width="1"/>
  <text x="500" y="314" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9">in Oracle's 23-doc companion experiment (40 candidates) — small corpus, make your own measurement before shipping</text>

  <!-- left footnote pill -->
  <rect x="80" y="298" width="340" height="26" rx="8" fill="#0D1117" stroke="#303A4E" stroke-width="1"/>
  <text x="98" y="314" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9">equal-weight is a strawman — tune or learn weights for your corpus</text>

  <!-- bottom micro-note -->
  <text x="480" y="440" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle">hybrid is a trade; reranking is a purchase — the budget line matters more than the NDCG line</text>
</svg>
