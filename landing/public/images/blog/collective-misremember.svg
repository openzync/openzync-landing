<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Three agents A, B, and C, each with a memory chip, reinforce each other through shared-context arrows between adjacent agents; the three memory chips funnel into a single red box labeled 'the shared false belief' with the tag 'misremembers collectively' — separate inputs converge on one wrong consensus; below, a highlighted 'source scrutiny' gate intercepts the reinforcement path via a dashed 'authority check' arrow, and the consolidated output splits into a verified fact box and an unverified box — source scrutiny breaks the convergence">
  <defs>
    <marker id="collectArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">the Mandela effect in multi-agent systems</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">shared context converges on a shared false belief</text>

  <!-- ============ AGENT ROW ============ -->
  <rect x="100" y="104" width="180" height="64" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <circle cx="130" cy="136" r="16" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="130" y="142" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">A</text>
  <text x="156" y="132" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Agent A</text>
  <text x="156" y="150" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">shares context</text>

  <rect x="390" y="104" width="180" height="64" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <circle cx="420" cy="136" r="16" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="420" y="142" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">B</text>
  <text x="446" y="132" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Agent B</text>
  <text x="446" y="150" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">shares context</text>

  <rect x="680" y="104" width="180" height="64" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <circle cx="710" cy="136" r="16" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="710" y="142" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">C</text>
  <text x="736" y="132" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Agent C</text>
  <text x="736" y="150" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">shares context</text>

  <!-- shared-context reinforcement arrows -->
  <line x1="280" y1="136" x2="386" y2="136" stroke="#7A9BC4" stroke-width="2" marker-end="url(#collectArr)"/>
  <text x="333" y="126" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">shared context</text>
  <text x="333" y="152" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">reinforcement</text>

  <line x1="570" y1="136" x2="676" y2="136" stroke="#7A9BC4" stroke-width="2" marker-end="url(#collectArr)"/>
  <text x="623" y="126" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">shared context</text>
  <text x="623" y="152" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">reinforcement</text>

  <!-- memory chips -->
  <line x1="190" y1="168" x2="190" y2="176" stroke="#4E5A6E" stroke-width="1"/>
  <rect x="145" y="180" width="90" height="28" rx="8" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="190" y="198" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">memory</text>

  <line x1="480" y1="168" x2="480" y2="176" stroke="#4E5A6E" stroke-width="1"/>
  <rect x="435" y="180" width="90" height="28" rx="8" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="480" y="198" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">memory</text>

  <line x1="770" y1="168" x2="770" y2="176" stroke="#4E5A6E" stroke-width="1"/>
  <rect x="725" y="180" width="90" height="28" rx="8" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="770" y="198" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">memory</text>

  <!-- ============ CONVERGENCE FUNNEL: separate inputs, one wrong consensus ============ -->
  <text x="300" y="250" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">reinforced by shared context</text>

  <line x1="190" y1="208" x2="380" y2="286" stroke="#7A9BC4" stroke-width="2" marker-end="url(#collectArr)"/>
  <line x1="480" y1="208" x2="480" y2="286" stroke="#7A9BC4" stroke-width="2" marker-end="url(#collectArr)"/>
  <line x1="770" y1="208" x2="580" y2="286" stroke="#7A9BC4" stroke-width="2" marker-end="url(#collectArr)"/>

  <!-- the shared false belief -->
  <rect x="350" y="290" width="260" height="56" rx="12" fill="#171214" stroke="#E5534B" stroke-width="2"/>
  <line x1="368" y1="302" x2="388" y2="322" stroke="#E5534B" stroke-width="2.5"/>
  <line x1="388" y1="302" x2="368" y2="322" stroke="#E5534B" stroke-width="2.5"/>
  <text x="404" y="316" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">the shared false belief</text>
  <text x="404" y="334" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic">misremembers collectively</text>

  <!-- ============ MITIGATION: source scrutiny gate ============ -->
  <line x1="480" y1="350" x2="480" y2="384" stroke="#7A9BC4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#collectArr)"/>
  <text x="490" y="372" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">authority check</text>

  <rect x="400" y="388" width="160" height="48" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="480" y="415" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">source scrutiny</text>

  <rect x="580" y="388" width="150" height="48" rx="10" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="655" y="408" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">verified fact</text>
  <text x="655" y="425" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">cross-checked</text>

  <rect x="230" y="388" width="150" height="48" rx="10" fill="#1A2332" stroke="#4E5A6E" stroke-width="1.5"/>
  <text x="305" y="408" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">unverified</text>
  <text x="305" y="425" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">not consolidated</text>

  <line x1="560" y1="412" x2="576" y2="412" stroke="#7A9BC4" stroke-width="2" marker-end="url(#collectArr)"/>
  <line x1="400" y1="412" x2="384" y2="412" stroke="#7A9BC4" stroke-width="2" marker-end="url(#collectArr)"/>

  <text x="480" y="472" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">Source scrutiny breaks the convergence</text>
</svg>