<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Evidence chart of mind-virus transmission measurements: spreading agents planted their payload in SOUL.md in 88 percent of attempts and infected the next agent 55 percent of the time, versus ordinary workspace files at 12 percent of attempts with 17 percent success — and the spreader never mentioned the file in 68 percent of those attempts; a 20-hop timeline shows all four action payloads surviving every context wipe unbroken, with some evolved strains infecting more often than the original">
  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">transmission anatomy</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">what the researchers measured across propagation attempts</text>

  <!-- ============ section 1: where payloads were written ============ -->
  <rect x="60" y="96" width="840" height="198" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="80" y="124" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">where payloads were written</text>
  <text x="80" y="142" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">where spreading agents planted the payload — and what happened next</text>

  <!-- bar 1: SOUL.md -->
  <text x="300" y="167" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">SOUL.md</text>
  <text x="300" y="183" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">(agent memory file)</text>
  <rect x="340" y="158" width="440" height="26" rx="6" fill="#E5534B"/>
  <text x="788" y="176" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">88% of attempts</text>
  <text x="340" y="202" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10">→ infected the next agent 55% of the time</text>

  <!-- bar 2: ordinary workspace files -->
  <text x="300" y="231" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">ordinary workspace files</text>
  <text x="300" y="247" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">(docs, code, notes)</text>
  <rect x="340" y="222" width="60" height="26" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="408" y="240" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">12%</text>
  <text x="340" y="266" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10">→ infected the next agent 17% of the time</text>
  <text x="340" y="282" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">spreader never mentioned the file in 68% of those attempts</text>

  <!-- ============ section 2: survival across context wipes ============ -->
  <rect x="60" y="306" width="840" height="130" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="80" y="330" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">survival across context wipes</text>
  <text x="80" y="348" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">payload viability across 20 propagation hops, context wiped between every hop</text>

  <!-- unbroken survival strip -->
  <text x="100" y="368" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">all four action payloads survived every wipe</text>
  <text x="880" y="368" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">some evolved strains infected more often than the original</text>
  <rect x="100" y="376" width="780" height="12" rx="6" fill="#E5534B"/>

  <!-- hop timeline: 0 → 20 -->
  <line x1="100" y1="402" x2="880" y2="402" stroke="#303A4E" stroke-width="1.5"/>
  <line x1="100" y1="398" x2="100" y2="408" stroke="#303A4E" stroke-width="1.5"/>
  <line x1="139" y1="402" x2="139" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="178" y1="402" x2="178" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="217" y1="402" x2="217" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="256" y1="402" x2="256" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="295" y1="398" x2="295" y2="408" stroke="#303A4E" stroke-width="1.5"/>
  <line x1="334" y1="402" x2="334" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="373" y1="402" x2="373" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="412" y1="402" x2="412" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="451" y1="402" x2="451" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="490" y1="398" x2="490" y2="408" stroke="#303A4E" stroke-width="1.5"/>
  <line x1="529" y1="402" x2="529" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="568" y1="402" x2="568" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="607" y1="402" x2="607" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="646" y1="402" x2="646" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="685" y1="398" x2="685" y2="408" stroke="#303A4E" stroke-width="1.5"/>
  <line x1="724" y1="402" x2="724" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="763" y1="402" x2="763" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="802" y1="402" x2="802" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="841" y1="402" x2="841" y2="406" stroke="#303A4E" stroke-width="1"/>
  <line x1="880" y1="398" x2="880" y2="408" stroke="#303A4E" stroke-width="1.5"/>

  <text x="100" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">hop 0</text>
  <text x="295" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">5</text>
  <text x="490" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">10</text>
  <text x="685" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">15</text>
  <text x="880" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">20</text>

  <!-- takeaway -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" font-style="italic" text-anchor="middle">the wipe clears the agent — not the file</text>
</svg>
