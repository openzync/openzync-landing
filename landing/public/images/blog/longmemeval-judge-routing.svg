<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Judge routing before and after: the before lane sends the question through an answer LLM and then to the judge, struck through as deleted; the after lane feeds the question and retrieved context directly to the judge — two LLM calls reduced to one, grading what was measured">
  <defs>
    <marker id="jrArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="48" y="46" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600">judge routing: the answer stage is deleted</text>
  <text x="48" y="68" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">we judge the retrieved context directly — half the LLM calls, and the signal measures what we changed</text>

  <!-- ===== BEFORE lane (struck through, greyed) ===== -->
  <text x="48" y="112" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">BEFORE</text>

  <rect x="140" y="126" width="170" height="66" rx="12" fill="#161B22" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="225" y="155" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">question</text>
  <text x="225" y="173" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">from the dataset</text>

  <line x1="310" y1="159" x2="352" y2="159" stroke="#4E5A6E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#jrArr)"/>

  <rect x="358" y="126" width="220" height="66" rx="12" fill="#161B22" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="468" y="155" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">answer LLM</text>
  <text x="468" y="173" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">max_tokens 512 · a second guess</text>

  <line x1="578" y1="159" x2="620" y2="159" stroke="#4E5A6E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#jrArr)"/>

  <rect x="626" y="126" width="170" height="66" rx="12" fill="#161B22" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="711" y="155" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">judge</text>
  <text x="711" y="173" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">grades the answer</text>

  <!-- strike through the whole before lane -->
  <line x1="120" y1="159" x2="820" y2="159" stroke="#E5534B" stroke-width="3"/>
  <text x="848" y="156" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">deleted</text>
  <text x="848" y="174" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">the answer could rescue</text>
  <text x="848" y="186" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">a bad retrieval</text>

  <!-- middle chips -->
  <rect x="140" y="232" width="180" height="36" rx="18" fill="#1A2332" stroke="#303A4E" stroke-width="1.5"/>
  <text x="230" y="255" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">2 LLM calls → 1</text>

  <rect x="348" y="232" width="330" height="36" rx="18" fill="#1A2332" stroke="#303A4E" stroke-width="1.5"/>
  <text x="513" y="255" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">grades what was measured: retrieval</text>

  <!-- ===== AFTER lane ===== -->
  <text x="48" y="330" fill="#7A9BC4" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">AFTER</text>

  <rect x="140" y="344" width="330" height="80" rx="12" fill="#161B22" stroke="#4A7FC7" stroke-width="2"/>
  <text x="305" y="375" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">question + retrieved context</text>
  <text x="305" y="396" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">top-10 hybrid results · the ground-truth answer id</text>

  <line x1="470" y1="384" x2="560" y2="384" stroke="#7A9BC4" stroke-width="2" marker-end="url(#jrArr)"/>

  <rect x="566" y="344" width="360" height="80" rx="12" fill="#0A2A5A" stroke="#14488C" stroke-width="2"/>
  <text x="746" y="375" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">judge · nvidia/nemotron-3-ultra-550b-a55b</text>
  <text x="746" y="396" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">temperature 0 · max_tokens 512 · one call per question</text>

  <text x="956" y="380" fill="#7A9BC4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">current</text>
  <text x="956" y="398" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">verdict checkpointed,</text>
  <text x="956" y="410" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">errors counted separately</text>

  <!-- bottom caption -->
  <text x="600" y="470" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">a wrong-but-retrieved fact used to hide behind a fluent answer. Judging the context directly leaves retrieval nowhere to hide.</text>
</svg>
