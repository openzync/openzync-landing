<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Episode ingestion: conversation turns and events feed an extract-and-resolve step that folds entities and facts with validity windows into an existing graph, contrasted with a dashed whole-corpus recompute loop as the batch alternative">
  <defs>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">fold in, don&apos;t recompute</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">episodes fold into existing state · the dashed path rebuilds the whole graph from a corpus snapshot</text>

  <!-- turns stack label -->
  <text x="40" y="96" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">conversation turns &amp; events</text>

  <!-- turn boxes -->
  <rect x="40" y="112" width="190" height="50" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="135" y="142" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">turn 1</text>

  <rect x="40" y="186" width="190" height="50" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="135" y="216" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">turn 2</text>

  <rect x="40" y="260" width="190" height="50" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="135" y="290" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">turn n / event</text>

  <!-- arrows turns -> extract+resolve -->
  <line x1="234" y1="137" x2="322" y2="137" stroke="#7A9BC4" stroke-width="2" marker-end="url(#arrE)"/>
  <line x1="234" y1="211" x2="322" y2="211" stroke="#7A9BC4" stroke-width="2" marker-end="url(#arrE)"/>
  <line x1="234" y1="285" x2="322" y2="285" stroke="#7A9BC4" stroke-width="2" marker-end="url(#arrE)"/>

  <!-- extract + resolve -->
  <rect x="330" y="120" width="240" height="180" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="450" y="190" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="600">Extract + resolve</text>
  <text x="450" y="214" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">entities · relations · facts</text>
  <text x="450" y="234" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">validity windows · merge policy</text>
  <text x="450" y="266" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" font-style="italic">async, in the background</text>

  <!-- fold-in arrow -->
  <line x1="574" y1="205" x2="642" y2="205" stroke="#7A9BC4" stroke-width="2.5" marker-end="url(#arrE)"/>
  <text x="608" y="196" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">fold in</text>

  <!-- existing graph -->
  <rect x="650" y="100" width="270" height="240" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="668" y="130" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">existing graph</text>

  <rect x="668" y="146" width="234" height="32" rx="6" fill="#161B22" stroke="#303A4E" stroke-width="1"/>
  <text x="785" y="166" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">entities &amp; facts with validity</text>

  <rect x="668" y="188" width="234" height="32" rx="6" fill="#161B22" stroke="#303A4E" stroke-width="1"/>
  <text x="785" y="208" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">edges expire with facts</text>

  <rect x="668" y="230" width="234" height="32" rx="6" fill="#161B22" stroke="#303A4E" stroke-width="1"/>
  <text x="785" y="250" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">supersede-not-delete</text>

  <rect x="668" y="272" width="234" height="32" rx="6" fill="#161B22" stroke="#303A4E" stroke-width="1"/>
  <text x="785" y="292" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">queryable as-of any instant</text>

  <!-- batch / GraphRAG alternative -->
  <rect x="40" y="380" width="880" height="76" rx="10" fill="#1A2332" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="404" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">batch / GraphRAG alternative — whole-corpus recompute</text>
  <text x="60" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">extract everything at once → cluster → LLM-precomputed community summaries</text>
  <text x="920" y="424" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="end">seconds to minutes · fine for static corpora, wrong for live agents</text>

  <!-- dashed loop: corpus snapshot down, rebuild up -->
  <line x1="130" y1="314" x2="130" y2="376" stroke="#7A9BC4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrE)"/>
  <text x="140" y="350" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">corpus snapshot</text>

  <line x1="785" y1="378" x2="785" y2="344" stroke="#7A9BC4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrE)"/>
  <text x="795" y="362" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">rebuilds the whole graph</text>

  <text x="480" y="470" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">per-episode extraction is the price of never rebuilding — and it is paid in the background.</text>
</svg>
