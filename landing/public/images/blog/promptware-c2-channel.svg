<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="The Promptware kill chain: plant a payload through any ingest path, persist it as a memory entry, trigger it later on retrieval, and the agent acts with its own tools — the memory store in the middle is the C2 hub that survives wipes, is trusted on read, and broadcasts to every agent">
  <defs>
    <marker id="pwArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E5534B"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">the promptware kill chain</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">four mundane stages — the memory store in the middle is the C2 channel</text>

  <!-- ============ stage boxes ============ -->
  <rect x="56" y="96" width="180" height="88" rx="10" fill="#0A2A5A" stroke="#E5534B" stroke-width="2"/>
  <text x="146" y="126" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">1 · plant</text>
  <text x="146" y="150" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">ingested content</text>

  <rect x="268" y="96" width="180" height="88" rx="10" fill="#0A2A5A" stroke="#E5534B" stroke-width="2"/>
  <text x="358" y="126" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">2 · persist</text>
  <text x="358" y="150" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">becomes a memory entry</text>

  <rect x="512" y="96" width="180" height="88" rx="10" fill="#0A2A5A" stroke="#E5534B" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="602" y="126" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">3 · trigger</text>
  <text x="602" y="150" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">surfaced on retrieval</text>

  <rect x="724" y="96" width="180" height="88" rx="10" fill="#0A2A5A" stroke="#E5534B" stroke-width="2"/>
  <text x="814" y="126" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">4 · act</text>
  <text x="814" y="150" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">agent executes</text>

  <!-- stage arrows -->
  <line x1="236" y1="140" x2="260" y2="140" stroke="#E5534B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pwArr)"/>
  <line x1="448" y1="140" x2="504" y2="140" stroke="#E5534B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pwArr)"/>
  <line x1="692" y1="140" x2="716" y2="140" stroke="#E5534B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pwArr)"/>

  <!-- vertical: plant writes down into the store -->
  <line x1="146" y1="192" x2="146" y2="280" stroke="#E5534B" stroke-width="2" marker-end="url(#pwArr)"/>
  <text x="158" y="240" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11">write</text>

  <!-- vertical: store feeds trigger back up -->
  <line x1="602" y1="280" x2="602" y2="192" stroke="#E5534B" stroke-width="2" marker-end="url(#pwArr)"/>
  <text x="590" y="240" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="end">retrieved later</text>

  <!-- vertical: acting agent writes new memories (loop feeds itself) -->
  <line x1="814" y1="192" x2="814" y2="280" stroke="#E5534B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pwArr)"/>
  <text x="802" y="240" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="end">writes new memories</text>

  <!-- ============ memory store strip ============ -->
  <rect x="56" y="288" width="848" height="72" rx="10" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="76" y="318" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">MEMORY STORE — the C2 hub</text>
  <text x="76" y="340" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">survives wipes · trusted on read · shared across agents</text>
  <rect x="726" y="302" width="158" height="24" rx="6" fill="#171214" stroke="#E5534B" stroke-width="1.5"/>
  <text x="805" y="318" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">no socket to watch</text>

  <!-- takeaway -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" font-style="italic" text-anchor="middle">no socket, no process, no alert — the compromised host calls itself</text>
</svg>
