<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="The benchmark-reality gap: a benchmark score bar shows 94 with LoCoMo near-saturated, but the same agent fails a real multi-session task — a red cross and a sliver of a bar showing 12 percent recall on a fresh session">
  <defs>
    <marker id="benchGapArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">the benchmark-reality gap</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">what the score says vs. what the session does</text>

  <!-- LEFT: benchmark panel -->
  <rect x="24" y="90" width="380" height="300" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="214" y="118" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">benchmark score</text>
  <text x="214" y="136" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">single-session recall</text>

  <text x="214" y="182" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="700" text-anchor="middle">94</text>
  <rect x="184" y="186" width="60" height="130" rx="8" fill="#1A2332" stroke="#303A4E"/>
  <rect x="184" y="199" width="60" height="117" rx="8" fill="#4A7FC7"/>

  <text x="214" y="340" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">LoCoMo — near-saturated</text>
  <text x="214" y="358" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">one session · nothing carried forward</text>

  <!-- MIDDLE: the transition -->
  <line x1="408" y1="240" x2="548" y2="240" stroke="#7A9BC4" stroke-width="2" marker-end="url(#benchGapArr)"/>
  <text x="478" y="228" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">reality check</text>
  <text x="478" y="258" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">multi-session task</text>

  <!-- RIGHT: reality panel -->
  <rect x="556" y="90" width="380" height="300" rx="14" fill="#171214" stroke="#E5534B" stroke-width="1.5"/>
  <text x="746" y="118" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">what really happens</text>
  <text x="746" y="136" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">multi-session run</text>

  <line x1="716" y1="155" x2="776" y2="215" stroke="#E5534B" stroke-width="2.5"/>
  <line x1="776" y1="155" x2="716" y2="215" stroke="#E5534B" stroke-width="2.5"/>
  <text x="746" y="252" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">real task: fails</text>
  <text x="746" y="272" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">the same agent · a fresh session</text>

  <rect x="700" y="288" width="92" height="70" rx="8" fill="#1A2332" stroke="#4E5A6E"/>
  <rect x="700" y="350" width="92" height="8" rx="4" fill="#E5534B"/>
  <text x="746" y="378" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">12% recall on a fresh session</text>

  <!-- bottom caption -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">scores on recall benchmarks don&apos;t predict performance on realistic multi-session agents</text>
</svg>
