<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Memory-server taxonomy: a 2x2 grid of storage models — key-value, vector, graph, and temporal graph — progressing from simple to expressive">
  <defs>
    <marker id="mcpTypesArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">memory-server types</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">the storage model is the taxonomy — each adds structure, and time, to what is kept</text>

  <!-- Q1: Key-Value -->
  <rect x="40" y="100" width="430" height="150" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <rect x="350" y="116" width="96" height="22" rx="11" fill="#161B22" stroke="#303A4E"/>
  <text x="398" y="131" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">simplest</text>
  <text x="64" y="136" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Key-Value</text>
  <text x="64" y="166" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">a plain dictionary — simplest to build, fastest to read</text>
  <circle cx="68" cy="186" r="2.5" fill="#4A7FC7"/>
  <text x="80" y="190" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">key → value · last-write-wins</text>
  <circle cx="68" cy="206" r="2.5" fill="#4A7FC7"/>
  <text x="80" y="210" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">good for preferences and settings</text>

  <!-- Q2: Vector -->
  <rect x="490" y="100" width="430" height="150" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <rect x="800" y="116" width="96" height="22" rx="11" fill="#161B22" stroke="#303A4E"/>
  <text x="848" y="131" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">similarity</text>
  <text x="514" y="136" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Vector</text>
  <text x="514" y="166" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">embeddings + top-k — find the turns that read like this one</text>
  <circle cx="518" cy="186" r="2.5" fill="#4A7FC7"/>
  <text x="530" y="190" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">cosine distance · hybrid with BM25</text>
  <circle cx="518" cy="206" r="2.5" fill="#4A7FC7"/>
  <text x="530" y="210" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">good for fuzzy recall of passages</text>

  <!-- Q3: Graph -->
  <rect x="40" y="270" width="430" height="150" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <rect x="350" y="286" width="96" height="22" rx="11" fill="#161B22" stroke="#303A4E"/>
  <text x="398" y="301" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">relations</text>
  <text x="64" y="306" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Graph</text>
  <text x="64" y="336" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">entities and edges — who knows whom, what touched what</text>
  <circle cx="68" cy="356" r="2.5" fill="#4A7FC7"/>
  <text x="80" y="360" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">traverse neighbor hops</text>
  <circle cx="68" cy="376" r="2.5" fill="#4A7FC7"/>
  <text x="80" y="380" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">good for people, orgs, projects</text>

  <!-- Q4: Temporal Graph -->
  <rect x="490" y="270" width="430" height="150" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <rect x="800" y="286" width="96" height="22" rx="11" fill="#161B22" stroke="#303A4E"/>
  <text x="848" y="301" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">time-aware</text>
  <text x="514" y="306" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Temporal Graph</text>
  <text x="514" y="336" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">graph plus time — facts supersede instead of overwrite</text>
  <circle cx="518" cy="356" r="2.5" fill="#4A7FC7"/>
  <text x="530" y="360" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">valid-from windows · effective-at reads</text>
  <circle cx="518" cy="376" r="2.5" fill="#4A7FC7"/>
  <text x="530" y="380" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">good for evolving truth</text>

  <!-- progression arrow: simple → expressive -->
  <text x="480" y="252" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">structure + time →</text>
  <line x1="300" y1="262" x2="660" y2="262" stroke="#7A9BC4" stroke-width="2" marker-end="url(#mcpTypesArr)"/>

  <!-- bottom caption -->
  <text x="480" y="468" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-style="italic">One axis: how much structure — and how much time — the store keeps. Pick the model your failure modes demand.</text>
</svg>
