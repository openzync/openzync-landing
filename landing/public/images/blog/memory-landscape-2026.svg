<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="The three architectural bets for agent memory in 2026: Mem0, Zep, and OpenZync">
  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#0D1117" rx="16"/>

  <!-- ============ MEM0 ============ -->
  <rect x="24" y="40" width="288" height="452" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="168" y="72" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="20" text-anchor="middle" font-weight="700">Mem0</text>
  <text x="168" y="92" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">vector-first · Apache 2.0</text>

  <rect x="48" y="112" width="240" height="40" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <text x="168" y="137" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">episodes</text>

  <line x1="168" y1="154" x2="168" y2="170" stroke="#4E5A6E" stroke-width="2" marker-end="url(#arrA)"/>

  <rect x="48" y="176" width="240" height="40" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <text x="168" y="201" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">LLM extraction + embeddings</text>

  <line x1="168" y1="218" x2="168" y2="234" stroke="#4E5A6E" stroke-width="2" marker-end="url(#arrA)"/>

  <rect x="48" y="240" width="240" height="40" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <text x="168" y="265" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">vector store → top-k</text>

  <!-- graph bolt-on, paywalled -->
  <rect x="48" y="308" width="240" height="40" rx="9" fill="none" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="132" y="333" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">graph memory</text>
  <rect x="196" y="316" width="92" height="24" rx="6" fill="#1A2332" stroke="#4E5A6E"/>
  <text x="242" y="332" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">paid Pro plan</text>

  <text x="168" y="440" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">open vector SDK,</text>
  <text x="168" y="456" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">graph layer behind the paywall</text>

  <!-- ============ ZEP ============ -->
  <rect x="330" y="40" width="288" height="452" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="474" y="72" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="20" text-anchor="middle" font-weight="700">Zep</text>
  <text x="474" y="92" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">temporal KG · Graphiti</text>

  <rect x="354" y="112" width="240" height="40" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <text x="474" y="137" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">episodes</text>

  <line x1="474" y1="154" x2="474" y2="170" stroke="#4E5A6E" stroke-width="2" marker-end="url(#arrA)"/>

  <rect x="354" y="176" width="240" height="40" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <text x="474" y="201" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">entities + facts</text>

  <line x1="474" y1="218" x2="474" y2="234" stroke="#4E5A6E" stroke-width="2" marker-end="url(#arrA)"/>

  <rect x="354" y="240" width="240" height="40" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <text x="474" y="265" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">valid_from / valid_until</text>

  <rect x="354" y="308" width="240" height="40" rx="9" fill="none" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="474" y="333" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">Zep Cloud</text>

  <text x="474" y="440" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">community ed. retired Apr 2025</text>
  <text x="474" y="456" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">self-host = rebuild Graphiti yourself</text>

  <!-- ============ OPENZYNC ============ -->
  <rect x="636" y="40" width="288" height="452" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <text x="780" y="72" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="20" text-anchor="middle" font-weight="700">OpenZync</text>
  <text x="780" y="92" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">temporal KG · self-host</text>

  <rect x="660" y="112" width="240" height="40" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <text x="780" y="137" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">episodes → Postgres</text>

  <line x1="780" y1="154" x2="780" y2="170" stroke="#4E5A6E" stroke-width="2" marker-end="url(#arrA)"/>

  <rect x="660" y="176" width="240" height="40" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <text x="780" y="201" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">SPO facts + versioned rows</text>

  <line x1="780" y1="218" x2="780" y2="234" stroke="#4E5A6E" stroke-width="2" marker-end="url(#arrA)"/>

  <rect x="660" y="240" width="240" height="40" rx="9" fill="#1A2332" stroke="#303A4E"/>
  <text x="780" y="265" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">hybrid RRF retrieval</text>

  <rect x="660" y="308" width="240" height="40" rx="9" fill="none" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="780" y="333" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">AGPL-3 · BYO-LLM</text>

  <text x="780" y="440" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">your Postgres · your LLM keys</text>
  <text x="780" y="456" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">no paywalled graph layer</text>

  <text x="480" y="522" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-style="italic">Zep made the temporal bet and went SaaS. Mem0 stayed open and paywalled the graph. Neither owns the open temporal layer — that is the slot OpenZync fills.</text>
</svg>