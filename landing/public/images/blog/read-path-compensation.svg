<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Failure mechanism diagram: a messy mixed store of preferences, events and stale facts feeds an escalating read path of query router, iterative search, reranker and LLM re-scan with rising cost ticks, yet the outcome box still reads same store, still noisy above a red dashed failure band with conflicting preference chips">
  <defs>
    <marker id="rpInArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
    <marker id="rpEscArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A7FC7"/>
    </marker>
    <marker id="rpOutArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- captions top-LEFT -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">The read-path compensation loop</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">More compute on retrieval never rewrites what was stored</text>

  <!-- zone headers -->
  <text x="60" y="118" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">storage</text>
  <text x="400" y="118" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">read path — escalating compute</text>
  <text x="700" y="118" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">outcome</text>

  <!-- ===== left: messy mixed store ===== -->
  <rect x="60" y="168" width="180" height="160" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.8"/>
  <text x="150" y="196" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Messy mixed store</text>
  <text x="150" y="216" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">preferences + events</text>
  <text x="150" y="230" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">+ stale facts</text>

  <!-- slightly misaligned chips: the mess, kept geometric -->
  <rect x="76" y="248" width="76" height="26" rx="6" fill="#0D1117" stroke="#4A7FC7" stroke-width="1.2"/>
  <text x="114" y="265" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">pref?</text>

  <rect x="158" y="251" width="66" height="26" rx="6" fill="#0D1117" stroke="#4A7FC7" stroke-width="1.2"/>
  <text x="191" y="268" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">evt</text>

  <rect x="76" y="286" width="76" height="26" rx="6" fill="#0D1117" stroke="#4A7FC7" stroke-width="1.2"/>
  <text x="114" y="303" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">stale</text>

  <rect x="158" y="283" width="76" height="26" rx="6" fill="#0D1117" stroke="#4A7FC7" stroke-width="1.2"/>
  <text x="196" y="300" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">conflict</text>

  <!-- store → stack -->
  <line x1="244" y1="248" x2="394" y2="391" stroke="#7A9BC4" stroke-width="2" marker-end="url(#rpInArr)"/>

  <!-- ===== center: escalating stack, entry at bottom, climbs upward ===== -->
  <!-- LLM re-scan (top, costliest) -->
  <rect x="400" y="150" width="220" height="54" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.8"/>
  <text x="414" y="182" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">LLM re-scan</text>
  <text x="606" y="181" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">+$$</text>

  <line x1="510" y1="220" x2="510" y2="206" stroke="#4A7FC7" stroke-width="1.6" marker-end="url(#rpEscArr)"/>

  <!-- Reranker -->
  <rect x="400" y="222" width="220" height="54" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.8"/>
  <text x="414" y="254" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Reranker</text>
  <text x="606" y="253" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">+$</text>

  <line x1="510" y1="290" x2="510" y2="278" stroke="#4A7FC7" stroke-width="1.6" marker-end="url(#rpEscArr)"/>

  <!-- Iterative search -->
  <rect x="400" y="294" width="220" height="54" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.8"/>
  <text x="414" y="326" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Iterative search</text>
  <text x="606" y="325" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">++</text>

  <line x1="510" y1="364" x2="510" y2="350" stroke="#4A7FC7" stroke-width="1.6" marker-end="url(#rpEscArr)"/>

  <!-- Query router (entry) -->
  <rect x="400" y="366" width="220" height="54" rx="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.8"/>
  <text x="414" y="398" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Query router</text>
  <text x="606" y="397" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">+</text>

  <!-- ===== right: outcome ===== -->
  <rect x="700" y="134" width="200" height="64" rx="10" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.8"/>
  <text x="800" y="162" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Same store, still noisy</text>
  <text x="800" y="182" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">compute spent · store unchanged</text>

  <!-- stack → outcome -->
  <line x1="624" y1="177" x2="694" y2="166" stroke="#7A9BC4" stroke-width="2" marker-end="url(#rpOutArr)"/>

  <!-- honest-failure band -->
  <rect x="700" y="222" width="200" height="150" rx="10" fill="#171214" stroke="#E5534B" stroke-width="1.6" stroke-dasharray="7 5"/>

  <!-- red noise indicator -->
  <circle cx="726" cy="250" r="11" fill="none" stroke="#E5534B" stroke-width="1.4"/>
  <line x1="726" y1="244" x2="726" y2="251" stroke="#E5534B" stroke-width="1.6"/>
  <circle cx="726" cy="255" r="1.4" fill="#E5534B"/>
  <text x="744" y="254" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">still mixed</text>

  <!-- overlapping mismatched chips -->
  <rect x="714" y="278" width="112" height="26" rx="6" fill="#0D1117" stroke="#E5534B" stroke-width="1.4"/>
  <text x="770" y="295" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">pref: on</text>

  <rect x="770" y="300" width="112" height="26" rx="6" fill="#0D1117" stroke="#E5534B" stroke-width="1.4"/>
  <text x="826" y="317" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">pref: off</text>

  <text x="800" y="354" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">noise persists after every read</text>

  <!-- bottom micro-note -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle">compensation scales the read path — it never rewrites the store</text>
</svg>
