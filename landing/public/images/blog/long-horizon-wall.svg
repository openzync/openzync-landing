<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Agent performance collapses at the 50-turn wall with red dashed line separating blue success steps before the wall from red failure scatter of import errors and forgotten tasks after, and a bar comparison showing a tall gray 2M-token dump with flat failure versus a short blue Recuris harness bar delivering plus 32.2 lift on the longest quartile">
  <defs>
    <marker id="lhWallArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A7FC7"/>
    </marker>
    <marker id="lhFailArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E5534B"/>
    </marker>
    <marker id="lhLiftArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A7FC7"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- captions top-LEFT -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">the 50-turn wall</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">agents collapse after ~50 turns — 2M tokens doesn't move the wall</text>

  <!-- left panel: trajectory 0 → 80 -->
  <rect x="60" y="96" width="520" height="316" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="80" y="124" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">single-agent trajectory · 0 → 80 turns</text>
  <text x="80" y="138" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">success before the wall · failure after</text>

  <!-- track baseline -->
  <line x1="80" y1="218" x2="560" y2="218" stroke="#303A4E" stroke-width="1.4"/>
  <!-- tick marks -->
  <line x1="80" y1="218" x2="80" y2="228" stroke="#5A6B80" stroke-width="1.2"/>
  <line x1="230" y1="218" x2="230" y2="228" stroke="#5A6B80" stroke-width="1.2"/>
  <line x1="380" y1="218" x2="380" y2="228" stroke="#E5534B" stroke-width="1.4"/>
  <line x1="560" y1="218" x2="560" y2="228" stroke="#5A6B80" stroke-width="1.2"/>
  <text x="80" y="244" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">0</text>
  <text x="230" y="244" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">25</text>
  <text x="380" y="244" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">50</text>
  <text x="560" y="244" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">80</text>

  <!-- dashed red wall at 50 -->
  <line x1="380" y1="150" x2="380" y2="236" stroke="#E5534B" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="342" y="150" width="76" height="18" rx="9" fill="#171214" stroke="#E5534B" stroke-width="1.2"/>
  <text x="380" y="162" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">50-turn wall</text>

  <!-- before-wall: blue solid success steps -->
  <rect x="92" y="182" width="58" height="24" rx="7" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.6"/>
  <text x="121" y="197" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">turn 8</text>
  <line x1="121" y1="206" x2="121" y2="216" stroke="#4A7FC7" stroke-width="1.2"/>

  <rect x="168" y="182" width="58" height="24" rx="7" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.6"/>
  <text x="197" y="197" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">turn 22</text>
  <line x1="197" y1="206" x2="197" y2="216" stroke="#4A7FC7" stroke-width="1.2"/>

  <rect x="244" y="182" width="58" height="24" rx="7" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.6"/>
  <text x="273" y="197" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">turn 34</text>
  <line x1="273" y1="206" x2="273" y2="216" stroke="#4A7FC7" stroke-width="1.2"/>

  <rect x="310" y="182" width="54" height="24" rx="7" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.6"/>
  <text x="337" y="197" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">turn 46</text>
  <line x1="337" y1="206" x2="337" y2="216" stroke="#4A7FC7" stroke-width="1.2"/>

  <!-- after-wall: red failure scatter -->
  <rect x="398" y="168" width="92" height="22" rx="11" fill="#171214" stroke="#E5534B" stroke-width="1.4"/>
  <circle cx="410" cy="179" r="5.5" fill="none" stroke="#E5534B" stroke-width="1.2"/>
  <line x1="407" y1="176" x2="413" y2="182" stroke="#E5534B" stroke-width="1.2"/>
  <line x1="413" y1="176" x2="407" y2="182" stroke="#E5534B" stroke-width="1.2"/>
  <text x="420" y="183" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600">ImportError</text>

  <rect x="404" y="198" width="96" height="22" rx="11" fill="#171214" stroke="#E5534B" stroke-width="1.4"/>
  <circle cx="416" cy="209" r="5.5" fill="none" stroke="#E5534B" stroke-width="1.2"/>
  <line x1="413" y1="206" x2="419" y2="212" stroke="#E5534B" stroke-width="1.2"/>
  <line x1="419" y1="206" x2="413" y2="212" stroke="#E5534B" stroke-width="1.2"/>
  <text x="426" y="213" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600">forgot task</text>

  <rect x="474" y="168" width="74" height="22" rx="11" fill="#171214" stroke="#E5534B" stroke-width="1.4"/>
  <text x="511" y="183" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">loops</text>

  <rect x="492" y="198" width="58" height="22" rx="11" fill="#171214" stroke="#E5534B" stroke-width="1.4"/>
  <text x="521" y="213" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">drift</text>

  <!-- success / failure zone labels -->
  <text x="220" y="268" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">before: coherent execution</text>
  <text x="472" y="268" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">after: collapse</text>
  <line x1="142" y1="274" x2="298" y2="274" stroke="#4A7FC7" stroke-width="1.1" marker-end="url(#lhWallArr)"/>
  <line x1="428" y1="274" x2="512" y2="274" stroke="#E5534B" stroke-width="1.1" marker-end="url(#lhFailArr)"/>

  <!-- contextual pill inside left panel -->
  <rect x="80" y="288" width="480" height="26" rx="8" fill="#0D1117" stroke="#303A4E" stroke-width="1"/>
  <text x="320" y="304" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">failure mode is not token length — errors compound and the goal is lost</text>

  <!-- right panel: tokens vs harness -->
  <rect x="600" y="96" width="300" height="316" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="620" y="124" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">more tokens ≠ more memory</text>
  <text x="620" y="138" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">harness beats context length</text>

  <!-- bar baseline -->
  <line x1="630" y1="332" x2="870" y2="332" stroke="#303A4E" stroke-width="1"/>
  <text x="630" y="348" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">2M-token</text>
  <text x="630" y="358" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">dump</text>
  <text x="760" y="348" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">Recuris</text>
  <text x="760" y="358" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">harness</text>

  <!-- left bar: tall gray, flat failure -->
  <rect x="605" y="162" width="50" height="170" rx="6" fill="#1A2332" stroke="#303A4E" stroke-width="1.6"/>
  <text x="630" y="180" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">2M</text>
  <!-- flat failure curve annotation -->
  <line x1="605" y1="302" x2="655" y2="302" stroke="#8A99AB" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="662" y="306" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="8">flat</text>

  <!-- right bar: short blue, high success -->
  <rect x="735" y="242" width="50" height="90" rx="6" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.8"/>
  <text x="760" y="260" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">short</text>
  <!-- lift arrow -->
  <line x1="792" y1="246" x2="792" y2="184" stroke="#4A7FC7" stroke-width="1.6" marker-end="url(#lhLiftArr)"/>
  <rect x="800" y="172" width="62" height="22" rx="11" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.4"/>
  <text x="831" y="187" fill="#4A7FC7" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">+32.2</text>
  <text x="760" y="392" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle">longest quartile · task success</text>

  <!-- divider label -->
  <text x="750" y="158" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="9" font-style="italic" text-anchor="middle">tall context, no gain</text>

  <!-- bottom micro-note -->
  <text x="480" y="440" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle">2M-token context does not shift the collapse — a harness that remembers does</text>
</svg>
