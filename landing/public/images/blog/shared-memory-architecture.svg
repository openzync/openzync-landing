<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Shared-memory architecture: agents A and B talk via A2A, while both read and write through a shared memory service exposed over MCP and backed by a temporal knowledge graph">
  <defs>
    <marker id="sharedMemArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">shared-memory architecture</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">A2A carries the message — MCP carries the memory</text>

  <!-- LEFT: Agent A -->
  <rect x="80" y="100" width="280" height="140" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <circle cx="112" cy="150" r="16" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="112" y="156" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">A</text>
  <text x="138" y="146" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Agent A</text>
  <text x="138" y="164" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">originates the task</text>

  <!-- RIGHT: Agent B -->
  <rect x="600" y="100" width="280" height="140" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <circle cx="632" cy="150" r="16" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="632" y="156" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">B</text>
  <text x="658" y="146" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Agent B</text>
  <text x="658" y="164" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">executes the task</text>

  <!-- A2A arrow between agents -->
  <line x1="364" y1="170" x2="596" y2="170" stroke="#7A9BC4" stroke-width="2" marker-start="url(#sharedMemArr)" marker-end="url(#sharedMemArr)"/>
  <text x="480" y="160" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">A2A — task · message</text>
  <text x="480" y="196" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">agents talk via A2A</text>

  <!-- both agents read/write memory: arrows down to the shared service -->
  <line x1="220" y1="244" x2="220" y2="284" stroke="#7A9BC4" stroke-width="2" marker-end="url(#sharedMemArr)"/>
  <text x="230" y="272" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">read · write</text>

  <line x1="740" y1="244" x2="740" y2="284" stroke="#7A9BC4" stroke-width="2" marker-end="url(#sharedMemArr)"/>
  <text x="750" y="272" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">read · write</text>

  <text x="480" y="272" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">both read/write memory via MCP</text>

  <!-- CENTER: shared memory service -->
  <rect x="330" y="290" width="300" height="120" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="350" y="316" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Shared memory service</text>
  <text x="350" y="334" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">stateless protocol · stateful store</text>

  <circle cx="358" cy="354" r="5" fill="#4A7FC7"/>
  <text x="372" y="358" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">memory.ingest — fold a turn in</text>

  <circle cx="358" cy="376" r="5" fill="#4A7FC7"/>
  <text x="372" y="380" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">memory.get_context — top-k recall</text>

  <circle cx="358" cy="398" r="5" fill="#8FAFD9"/>
  <text x="372" y="402" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12">graph.search — entity traversal</text>

  <!-- service down to storage -->
  <line x1="480" y1="414" x2="480" y2="424" stroke="#7A9BC4" stroke-width="2" marker-end="url(#sharedMemArr)"/>

  <!-- storage band -->
  <rect x="50" y="426" width="860" height="40" rx="10" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="480" y="450" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">temporal knowledge graph · episodes · facts</text>

  <!-- bottom caption -->
  <text x="480" y="476" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">A2A for communication, MCP for memory — the stack composes.</text>
</svg>
