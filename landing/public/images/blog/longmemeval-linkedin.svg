  <rect x="440" y="410" width="540" height="30" rx="6" fill="#78A9F2"/>
  <text x="64"  y="434" fill="#FFFFFF" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="28" font-weight="600">OpenZync</text>
  <text x="994" y="435" fill="#78A9F2" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="500">87.1</text>

  <rect x="440" y="458" width="528" height="30" rx="6" fill="#2E3A4E"/>
  <text x="64"  y="482" fill="#A8B5C5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="28">Supermemory</text>
