<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="LongMemEval-S 2026 band: scores sorted descending from OMEGA at 95.4 down to Mem0's old algorithm at 67.8, with OpenZync at 87.1 highlighted">
  <rect width="1200" height="627" fill="#0B0D12"/>

  <!-- title block -->
  <text x="64" y="104" fill="#EDF1F7" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="500">LongMemEval-S 2026 band</text>
  <text x="64" y="142" fill="#8A99AB" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="26">Mid-band, fully disclosed.</text>

  <!-- bars: x0=440, 6.2px per point, height 30, pitch 48 -->
  <rect x="440" y="170" width="592" height="30" rx="6" fill="#2E3A4E"/>
  <text x="64"  y="194" fill="#A8B5C5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="28">OMEGA</text>
  <text x="1046" y="195" fill="#F2F2F2" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="500">95.4</text>

  <rect x="440" y="218" width="588" height="30" rx="6" fill="#2E3A4E"/>
  <text x="64"  y="242" fill="#A8B5C5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="28">Mastra · gpt-5-mini</text>
  <text x="1042" y="243" fill="#F2F2F2" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="500">94.87</text>

  <rect x="440" y="266" width="585" height="30" rx="6" fill="#2E3A4E"/>
  <text x="64"  y="290" fill="#A8B5C5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="28">Mem0 · new</text>
  <text x="1039" y="291" fill="#F2F2F2" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="500">94.4</text>

  <rect x="440" y="314" width="567" height="30" rx="6" fill="#2E3A4E"/>
  <text x="64"  y="338" fill="#A8B5C5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="28">Hindsight</text>
  <text x="1021" y="339" fill="#F2F2F2" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="500">91.4</text>

  <rect x="440" y="362" width="559" height="30" rx="6" fill="#2E3A4E"/>
  <text x="64"  y="386" fill="#A8B5C5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="28">Zep</text>
  <text x="1013" y="387" fill="#F2F2F2" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="500">90.2</text>

