<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Two side-by-side charts contrasting hype with evidence for generative engine optimization: on the left, one tall blue bar shows search interest growing nine hundred ninety-seven percent in eighteen months; on the right, a controlled test measuring citation rate on GPT-4o-mini shows the untouched baseline cited thirteen point three four percent of the time while pages after the GEO checklist dropped to twelve point two one percent and a GEO variant to ten point nine two percent, with a note that adding statistics, quotes, citations, and authoritative tone led to being cited less often">
  <defs>
    <marker id="geoArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">interest vs. evidence</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">GEO content demand exploded while a controlled test found tactics lose to doing nothing</text>

  <!-- vertical divider -->
  <line x1="480" y1="96" x2="480" y2="426" stroke="#303A4E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ============ LEFT: search interest ============ -->
  <rect x="24" y="96" width="432" height="330" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <text x="40" y="120" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">search interest</text>
  <text x="40" y="138" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">queries for 'generative engine optimization'</text>

  <text x="260" y="164" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">search growth in 18 months</text>

  <!-- the big blue bar -->
  <rect x="200" y="176" width="120" height="204" rx="6" fill="#4A7FC7"/>
  <text x="260" y="210" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">+997%</text>

  <line x1="80" y1="380" x2="400" y2="380" stroke="#303A4E" stroke-width="1.5"/>
  <text x="260" y="402" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">generative engine optimization</text>

  <!-- between panels: from hype to evidence -->
  <line x1="456" y1="270" x2="494" y2="270" stroke="#7A9BC4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#geoArr)"/>

  <!-- ============ RIGHT: controlled test ============ -->
  <rect x="504" y="96" width="432" height="330" rx="14" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="520" y="120" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">controlled test</text>
  <text x="520" y="138" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11">citation rate on GPT-4o-mini · higher is better</text>

  <text x="520" y="162" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11">adding statistics, quotes, citations,</text>
  <text x="520" y="178" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="11">authoritative tone — cited LESS often</text>

  <!-- axes: 0-16% scale -->
  <line x1="560" y1="196" x2="560" y2="384" stroke="#303A4E" stroke-width="1.5"/>
  <line x1="560" y1="384" x2="900" y2="384" stroke="#303A4E" stroke-width="1.5"/>
  <text x="552" y="200" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">16%</text>
  <text x="552" y="247" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">12</text>
  <text x="552" y="294" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">8</text>
  <text x="552" y="341" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">4</text>
  <text x="552" y="388" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="end">0</text>

  <!-- bars: baseline wins -->
  <rect x="600" y="227" width="70" height="157" rx="4" fill="#4A7FC7"/>
  <rect x="700" y="240" width="70" height="144" rx="4" fill="#171214" stroke="#E5534B" stroke-width="1.5"/>
  <rect x="800" y="256" width="70" height="128" rx="4" fill="#171214" stroke="#E5534B" stroke-width="1.5"/>

  <text x="635" y="219" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">13.34%</text>
  <text x="735" y="232" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">12.21%</text>
  <text x="835" y="248" fill="#E5534B" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">10.92%</text>

  <!-- category labels -->
  <text x="635" y="402" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">no treatment</text>
  <text x="635" y="416" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">(baseline)</text>
  <text x="735" y="402" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">after GEO</text>
  <text x="735" y="416" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">checklist</text>
  <text x="835" y="402" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">after GEO</text>
  <text x="835" y="416" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">variant</text>

  <!-- bottom takeaway -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">the tactics everyone sells lost to the untouched page</text>
</svg>
