<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="Hybrid retrieval pipeline with reciprocal rank fusion">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="460" fill="#0D1117" rx="16"/>

  <!-- query -->
  <rect x="24" y="170" width="150" height="90" rx="14" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <path d="M 99 200 a 10 10 0 0 1 10 10 v 6 a 10 10 0 0 1 -10 10 h -18 a 10 10 0 0 1 -10 -10 v -6 a 10 10 0 0 1 10 -10 z" fill="#1A2332" stroke="#8FAFD9" stroke-width="1.5"/>
  <path d="M 88 218 h 24" stroke="#8FAFD9" stroke-width="2" stroke-linecap="round"/>
  <text x="99" y="244" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">Query</text>
  <text x="99" y="252" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">“why is Acme churning?”</text>

  <line x1="178" y1="215" x2="222" y2="215" stroke="#7A9BC4" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- legs -->
  <text x="230" y="72" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12">five independent search legs, in parallel</text>

  <rect x="230" y="88" width="240" height="42" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="350" y="113" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">Vector — episode embeddings</text>

  <rect x="230" y="140" width="240" height="42" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="350" y="165" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">BM25 — exact-match episodes</text>

  <rect x="230" y="192" width="240" height="42" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="350" y="217" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">BM25 — exact-match facts</text>

  <rect x="230" y="244" width="240" height="42" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="350" y="269" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">Graph BFS — multi-hop neighbours</text>

  <rect x="230" y="296" width="240" height="42" rx="10" fill="#161B22" stroke="#303A4E" stroke-width="1.5"/>
  <text x="350" y="321" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">Fact vector — as-of-today facts</text>

  <line x1="474" y1="215" x2="532" y2="215" stroke="#7A9BC4" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- RRF -->
  <rect x="540" y="150" width="140" height="130" rx="14" fill="#161B22" stroke="#4A7FC7" stroke-width="2"/>
  <text x="610" y="192" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="600">RRF fusion</text>
  <text x="610" y="212" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">reciprocal-rank,</text>
  <text x="610" y="227" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">no score mixing</text>
  <text x="610" y="258" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">one ranked list</text>

  <line x1="684" y1="215" x2="722" y2="215" stroke="#7A9BC4" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- rerank -->
  <rect x="730" y="150" width="100" height="130" rx="14" fill="none" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="780" y="196" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">Rerank</text>
  <text x="780" y="214" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">optional</text>
  <text x="780" y="230" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">cross-encoder</text>

  <line x1="834" y1="215" x2="858" y2="215" stroke="#7A9BC4" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- context -->
  <rect x="862" y="165" width="80" height="100" rx="14" fill="#0A2A5A" stroke="#14488C" stroke-width="2"/>
  <text x="902" y="210" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">Context</text>
  <text x="902" y="230" fill="#8FAFD9" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">for the prompt</text>

  <!-- cache note -->
  <rect x="230" y="362" width="520" height="46" rx="10" fill="#1A2332" stroke="#303A4E"/>
  <text x="490" y="383" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">results cached in Redis · a failing leg raises instead of returning a silent partial answer</text>
  <text x="490" y="400" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">pure vector misses SKUs · pure BM25 misses meaning — the blend catches both</text>

  <text x="480" y="438" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">five noisy retrievers, one calm answer.</text>
</svg>
