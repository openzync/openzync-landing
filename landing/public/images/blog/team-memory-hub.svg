<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Team memory hub: raw conversation is distilled layer by layer — L0 conversation, L1 atom, L2 scenario, L3 persona — into a governed memory hub fed by four asset types (chat memory, skill, LLM wiki, code graph), wrapped in private, team, and restricted access rings, with three agents reading only the assets they need">
  <defs>
    <marker id="teamMemArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A9BC4"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0D1117" rx="16"/>

  <!-- caption -->
  <text x="60" y="44" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">team memory: shared, governed, equipped</text>
  <text x="60" y="66" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">raw conversation distills into reusable assets — every agent reads only what it needs</text>

  <!-- LEFT LANE: distillation ladder -->
  <text x="24" y="88" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="12">distillation ladder</text>

  <rect x="24" y="102" width="150" height="40" rx="9" fill="#1A2332" stroke="#303A4E" stroke-width="1.5"/>
  <circle cx="42" cy="122" r="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="42" y="126" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">L0</text>
  <text x="58" y="118" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Conversation</text>
  <text x="58" y="136" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">raw turns</text>

  <rect x="24" y="152" width="150" height="40" rx="9" fill="#1A2332" stroke="#303A4E" stroke-width="1.5"/>
  <circle cx="42" cy="172" r="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="42" y="176" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">L1</text>
  <text x="58" y="168" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Atom</text>
  <text x="58" y="186" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">atomic facts</text>

  <rect x="24" y="202" width="150" height="40" rx="9" fill="#1A2332" stroke="#303A4E" stroke-width="1.5"/>
  <circle cx="42" cy="222" r="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="42" y="226" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">L2</text>
  <text x="58" y="218" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Scenario</text>
  <text x="58" y="236" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">episodic patterns</text>

  <rect x="24" y="252" width="150" height="40" rx="9" fill="#1A2332" stroke="#303A4E" stroke-width="1.5"/>
  <circle cx="42" cy="272" r="9" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="1.5"/>
  <text x="42" y="276" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">L3</text>
  <text x="58" y="268" fill="#D0D7E0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Persona</text>
  <text x="58" y="286" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10">long-term profile</text>

  <!-- distillation arrows -->
  <line x1="99" y1="142" x2="99" y2="150" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>
  <line x1="99" y1="192" x2="99" y2="200" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>
  <line x1="99" y1="242" x2="99" y2="250" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>

  <!-- persona feeds the hub -->
  <line x1="174" y1="272" x2="346" y2="272" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>

  <!-- ASSETS: four cards feeding the hub -->
  <rect x="311" y="88" width="80" height="40" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="351" y="112" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Chat Memory</text>

  <rect x="397" y="88" width="80" height="40" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="437" y="112" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Skill</text>

  <rect x="483" y="88" width="80" height="40" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="523" y="112" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LLM-Wiki</text>

  <rect x="569" y="88" width="80" height="40" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="609" y="112" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Code-Graph</text>

  <!-- asset arrows into the hub -->
  <line x1="351" y1="128" x2="351" y2="210" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>
  <line x1="437" y1="128" x2="437" y2="210" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>
  <line x1="523" y1="128" x2="523" y2="210" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>
  <line x1="609" y1="128" x2="609" y2="210" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>

  <!-- CENTER: memory hub -->
  <rect x="350" y="214" width="260" height="80" rx="12" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="480" y="247" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Memory Hub</text>
  <text x="480" y="266" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">team-level · shared · governed</text>
  <text x="480" y="283" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">scoped read · versioned write</text>

  <!-- access-control rings: private / team / restricted -->
  <rect x="342" y="206" width="276" height="96" rx="14" fill="none" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="334" y="198" width="292" height="112" rx="14" fill="none" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="326" y="190" width="308" height="128" rx="14" fill="none" stroke="#4E5A6E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="344" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">access control — private · team · restricted</text>

  <!-- RIGHT: agents reading from the hub -->
  <text x="845" y="164" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">each agent reads only what it needs</text>

  <rect x="750" y="176" width="190" height="58" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <circle cx="772" cy="205" r="14" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="772" y="210" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="796" y="200" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Agent A</text>
  <text x="796" y="218" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">chat memory · wiki</text>

  <rect x="750" y="246" width="190" height="58" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <circle cx="772" cy="275" r="14" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="772" y="280" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="796" y="270" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Agent B</text>
  <text x="796" y="288" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">code-graph only</text>

  <rect x="750" y="316" width="190" height="58" rx="14" fill="#161B22" stroke="#14488C" stroke-width="1.5"/>
  <circle cx="772" cy="345" r="14" fill="#0A2A5A" stroke="#4A7FC7" stroke-width="2"/>
  <text x="772" y="350" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="796" y="340" fill="#F2F2F2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Agent C</text>
  <text x="796" y="358" fill="#A8B5C5" font-family="Inter, system-ui, sans-serif" font-size="11">skills · persona</text>

  <!-- agent read arrows -->
  <line x1="610" y1="255" x2="746" y2="205" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>
  <line x1="610" y1="275" x2="746" y2="275" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>
  <line x1="610" y1="292" x2="746" y2="345" stroke="#7A9BC4" stroke-width="2" marker-end="url(#teamMemArr)"/>

  <!-- bottom caption -->
  <text x="480" y="452" fill="#8A99AB" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" font-style="italic">one hub, scoped access, equipped agents — shared by design, governed by default.</text>
</svg>